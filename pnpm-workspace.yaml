packages:
  - "packages/*"
  - "vendor/projectvisbug"
  - "simulations/enterprise-pm"
  - "simulations/enterprise-pm/services/*"
  - "simulations/enterprise-pm/packages/*"
  - "simulations/enterprise-pm/scenarios"

# pnpm 11은 strictDepBuilds=true가 기본이라 빌드 스크립트가 있는 의존성은 모두 명시해야 한다.
# pnpm 10에서 onlyBuiltDependencies에 없어 건너뛰던 패키지는 false로 유지한다.
allowBuilds:
  better-sqlite3: true
  '@swc/core': true
  # 아래는 install/postinstall 스크립트가 있으나 pnpm 10에서도 실행하지 않던 패키지
  '@nestjs/core': false
  '@pulumi/kubernetes': false
  esbuild: false
  fsevents: false
  msgpackr-extract: false
  protobufjs: false
  sharp: false
  workerd: false

# ragrid's old stylus range otherwise keeps deprecated source-map/glob
# packages in the workspace. The current stylus API remains compatible with
# the CSS build and Vite peer consumers used here.
overrides:
  stylus: ^0.64.0
  'stylus>glob': ^13.0.6

# 모노레포 전체에서 공유하는 버전은 여기에 catalog로 선언하고
# 각 package.json은 `"catalog:"`로 참조한다.
catalog:
  drizzle-orm: 1.0.0-beta.22
  drizzle-kit: 1.0.0-beta.22
  better-sqlite3: ^13.0.1
  "@types/better-sqlite3": ^7.6.13
  ioredis: ^5.4.0
  ioredis-mock: ^8.9.0
  lru-cache: ^11.0.0
