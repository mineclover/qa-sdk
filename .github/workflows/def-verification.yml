name: definition verification

on:
  pull_request:
    paths:
      - 'docs/specs/spec-verification/**'
      - 'docs/specs/definition-catalog/**'
      - 'packages/spec-tracker/**'
      - 'packages/definition-data-source/**'
      - 'packages/definition-catalog/**'
      - 'packages/cli/**'
      - 'scripts/spec-verification-runner.*'
      - '.github/workflows/def-verification.yml'
  push:
    branches: [main]
    paths:
      - 'docs/specs/spec-verification/**'
      - 'docs/specs/definition-catalog/**'
      - 'packages/spec-tracker/**'
      - 'packages/definition-data-source/**'
      - 'packages/definition-catalog/**'
      - 'packages/cli/**'
      - 'scripts/spec-verification-runner.*'
      - '.github/workflows/def-verification.yml'
  workflow_dispatch:

concurrency:
  group: definition-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERIFICATION_SPEC_IDS: spec-definition-merge-validation,spec-definition-separation,spec-tracker-system

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r run build

      - name: Sync definitions
        run: node packages/cli/dist/index.js def sync

      - name: Validate definition scan
        run: node packages/cli/dist/index.js def scan-audit

      - name: Capture run-start definition bindings
        id: binding
        run: |
          set -euo pipefail
          run_started_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          mkdir -p artifacts
          echo "run_started_at=$run_started_at" >> "$GITHUB_OUTPUT"
          node packages/cli/dist/index.js def verification-bindings \
            --local \
            --spec-ids="$VERIFICATION_SPEC_IDS" \
            --out=artifacts/verification-bindings.json \
            --captured-at="$run_started_at" \
            --json

      - name: Run runtime verification suites and write summary
        id: runner
        run: |
          set +e
          corepack pnpm exec tsx scripts/spec-verification-runner.ts \
            --summary=artifacts/verification-summary.json \
            --spec-ids="$VERIFICATION_SPEC_IDS"
          runner_status=$?
          set -e
          echo "status=$runner_status" >> "$GITHUB_OUTPUT"

      - name: Package verification artifact
        id: artifact
        if: always()
        run: |
          set -euo pipefail
          run_completed_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          echo "run_completed_at=$run_completed_at" >> "$GITHUB_OUTPUT"
          node packages/cli/dist/index.js def verification-artifact \
            --summary=artifacts/verification-summary.json \
            --bindings=artifacts/verification-bindings.json \
            --out=artifacts/verification-artifact.json \
            --run-started-at="${{ steps.binding.outputs.run_started_at }}" \
            --run-completed-at="$run_completed_at" \
            --json

      - name: Derive verification read model
        if: always()
        run: |
          set -euo pipefail
          node packages/cli/dist/index.js def state \
            --local \
            --verification-artifact=artifacts/verification-artifact.json \
            --json > artifacts/verification-state.json

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: definition-verification-${{ github.run_id }}
          path: artifacts/
          retention-days: 14

      - name: Fail when verification suite failed
        if: always()
        run: |
          runner_status="${{ steps.runner.outputs.status }}"
          if [ -z "$runner_status" ]; then
            exit 1
          fi
          exit "$runner_status"
