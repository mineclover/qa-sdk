name: Visbug Bridge E2E

on:
  push:
    branches: [main]
    paths:
      - packages/visbug-bridge/**
      - packages/rlsc-analysis/**
      - vendor/projectvisbug
      - pnpm-lock.yaml
      - .github/workflows/visbug-bridge-e2e.yml
  pull_request:
    branches: [main]
    paths:
      - packages/visbug-bridge/**
      - packages/rlsc-analysis/**
      - vendor/projectvisbug
      - pnpm-lock.yaml
      - .github/workflows/visbug-bridge-e2e.yml
  workflow_dispatch:

jobs:
  visbug-bridge-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install monorepo dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build vendor visbug bundle
        run: corepack pnpm --filter visbug run bundle

      - name: Run vendor unit tests
        run: corepack pnpm --filter visbug run test:unit

      - name: Build visbug-bridge
        run: corepack pnpm --filter visbug-bridge build

      - name: Install Playwright chromium
        run: corepack pnpm --filter visbug-bridge exec playwright install --with-deps chromium

      - name: Run visbug-bridge unit tests
        run: corepack pnpm --filter visbug-bridge test

      - name: Run visbug-bridge e2e tests
        run: corepack pnpm --filter visbug-bridge test:e2e

      - name: Run extension asset smoke
        run: xvfb-run -a corepack pnpm --filter visbug-bridge test:extension

      - name: Upload playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visbug-bridge-playwright-trace
          path: packages/visbug-bridge/test-results/
          retention-days: 7
