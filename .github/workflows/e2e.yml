name: E2E

# @qa-sdk/e2e — Playwright 기반 cross-app 브라우저 E2E.
# CI 본 라인에서 분리: e2e 회귀가 unit/integration 게이트를 막지 않도록.
on:
  push:
    branches: [main]
    paths:
      - packages/e2e/**
      - packages/shop-web/**
      - packages/platform-demo/**
      - .github/workflows/e2e.yml
  pull_request:
    branches: [main]
    paths:
      - packages/e2e/**
      - packages/shop-web/**
      - packages/platform-demo/**
      - .github/workflows/e2e.yml
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain (wasm-pack)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli

      - name: Build workspace deps
        # webServer (ingest-server, viz-web, ...) 가 @qa-sdk/store/dist 등을
        # 런타임에 import 하므로 미빌드 시 ERR_MODULE_NOT_FOUND.
        run: pnpm -r run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium
        run: pnpm --filter @qa-sdk/e2e exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --filter @qa-sdk/e2e test:e2e

      - name: Upload playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-trace
          path: packages/e2e/test-results/
          retention-days: 7
