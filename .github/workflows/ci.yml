name: CI

# 일시 비활성화 — pnpm-lock.yaml 불일치 해소 후 재활성화
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version:
          - 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qa_sdk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_sdk_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test

      - name: Run registry-server integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/qa_sdk_ci
        run: pnpm --filter @qa-sdk/registry-server run test:integration

      - name: Run store integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/qa_sdk_ci
        run: pnpm --filter @qa-sdk/store run test:integration

      - name: DKG self-check (빌드/테스트/커버리지/불변조건)
        run: node packages/cli/dist/index.js dkg self-check

      - name: DKG converge (수렴 분석)
        run: node packages/cli/dist/index.js dkg converge
