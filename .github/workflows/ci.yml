name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "skills/**"
      - "**/*.md"
      - "tasks/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version:
          - 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qa_sdk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_sdk_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli

      - name: Lint
        run: pnpm run lint:ci

      - name: Format check
        run: pnpm run format:check
        continue-on-error: true

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qa-sdk-build-dist
          path: packages/*/dist/
          retention-days: 1

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium
        run: pnpm --filter @qa-sdk/e2e exec playwright install chromium

      - name: Run unit tests
        run: pnpm run test

      - name: Run CLI heavy smoke lane
        env:
          QA_SDK_RUN_HEAVY_SMOKE: "1"
        run: pnpm --filter @qa-sdk/cli exec vitest run src/commands/dkg.e2e.test.ts -t "dkg self-check full path는 별도 heavy smoke lane에서 실행된다"

      - name: Run store integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/qa_sdk_ci
        run: pnpm --filter @qa-sdk/store run test:integration

  dkg-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: qa-sdk-build-dist
          path: packages

      - name: DKG self-check (빌드/테스트/커버리지/불변조건)
        run: node packages/cli/dist/index.js dkg self-check

      - name: DKG converge (수렴 분석)
        run: node packages/cli/dist/index.js dkg converge

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: npx better-npm-audit audit --level high
        continue-on-error: true
