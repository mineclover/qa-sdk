<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>플랫폼 인덱스 데모</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">

      <!-- ── Ribbon ─────────────────────────────────────────────────── -->
      <div class="ribbon">
        <div class="ribbon-brand">
          <span class="brand-icon">⊞</span>
          <span class="brand-name">플랫폼 인덱스 데모</span>
          <span class="brand-sub">MetaRegistry + index_ref Demo</span>
        </div>
        <div class="ribbon-tabs" role="tablist" aria-label="시트 탭">
          <button class="rtab active" data-sheet="overview" role="tab" aria-selected="true" aria-controls="sheet-overview">개요</button>
          <button class="rtab" data-sheet="service" role="tab" aria-selected="false" aria-controls="sheet-service">서비스</button>
          <button class="rtab" data-sheet="permission" role="tab" aria-selected="false" aria-controls="sheet-permission">권한</button>
          <button class="rtab" data-sheet="event" role="tab" aria-selected="false" aria-controls="sheet-event">이벤트</button>
          <button class="rtab" data-sheet="scenario" role="tab" aria-selected="false" aria-controls="sheet-scenario">시나리오</button>
          <button class="rtab" data-sheet="grant" role="tab" aria-selected="false" aria-controls="sheet-grant">부여관리</button>
          <button class="rtab" data-sheet="version" role="tab" aria-selected="false" aria-controls="sheet-version">버전</button>
        </div>
      </div>

      <!-- ── Formula bar ──────────────────────────────────────────── -->
      <div class="formula-bar">
        <div class="name-box" id="name-box">—</div>
        <div class="fb-divider"></div>
        <span class="fb-fx">fx</span>
        <div class="fb-formula" id="fb-formula">
          encode([dim₁, dim₂, …, dimₙ]) → 단일 정수 주소  |  protobuf varint 전송
        </div>
      </div>

      <!-- ── Axis selector bar (service sheet only) ────────────────── -->
      <div class="axis-bar" id="axis-bar">
        <div class="axis-group">
          <div class="axis-bar-label">X축</div>
          <div class="axis-btns" id="x-axis-btns"><!-- populated by main.ts --></div>
        </div>
        <div class="axis-bar-divider"></div>
        <div class="axis-group">
          <div class="axis-bar-label">Y축</div>
          <div class="axis-btns" id="y-axis-btns"><!-- populated by main.ts --></div>
        </div>
      </div>

      <!-- ── Workbook ──────────────────────────────────────────── -->
      <div class="workbook">

        <!-- Overview sheet -->
        <div class="sheet" id="sheet-overview" role="tabpanel" aria-label="개요">
          <div class="sheet-body overview-body">
            <div id="overview-container"></div>
          </div>
        </div>

        <!-- Service sheet -->
        <div class="sheet hidden" id="sheet-service" role="tabpanel" aria-label="서비스">
          <div class="sheet-body">
            <div class="dim-sidebar" id="svc-dim-sidebar"><!-- populated by main.ts --></div>
            <div class="sheet-grid-wrap">
              <div id="svc-grid-container"></div>
            </div>
            <aside class="side-panel">
              <div class="sp-placeholder" id="svc-sp-placeholder">
                <div class="sp-arrow">↑</div>
                <p>셀을 클릭하면<br/>서비스 상세 정보를<br/>확인합니다</p>
              </div>
              <div class="sp-content hidden" id="svc-sp-content"></div>
            </aside>
          </div>
        </div>

        <!-- Permission sheet -->
        <div class="sheet hidden" id="sheet-permission" role="tabpanel" aria-label="권한">
          <div class="sheet-body">
            <div class="sheet-grid-wrap">
              <div id="perm-grid-container"></div>
            </div>
            <aside class="side-panel">
              <div class="sp-placeholder" id="perm-sp-placeholder">
                <div class="sp-arrow">↑</div>
                <p>셀을 클릭하면<br/>권한 상세 정보를<br/>확인합니다</p>
              </div>
              <div class="sp-content hidden" id="perm-sp-content"></div>
            </aside>
          </div>
        </div>

        <!-- Event sheet -->
        <div class="sheet hidden" id="sheet-event" role="tabpanel" aria-label="이벤트">
          <div class="initiator-bar" id="evt-initiator-bar"><!-- populated by main.ts --></div>
          <div class="sheet-body">
            <div class="sheet-grid-wrap">
              <div id="evt-grid-container"></div>
            </div>
            <aside class="side-panel">
              <div class="sp-placeholder" id="evt-sp-placeholder">
                <div class="sp-arrow">↑</div>
                <p>셀을 클릭하면<br/>이벤트 상세 정보를<br/>확인합니다</p>
              </div>
              <div class="sp-content hidden" id="evt-sp-content"></div>
            </aside>
          </div>
        </div>

        <!-- Scenario sheet -->
        <div class="sheet hidden" id="sheet-scenario" role="tabpanel" aria-label="시나리오">
          <div class="sheet-body scenario-body">
            <div id="scenario-container"></div>
          </div>
        </div>

        <!-- Grant table sheet -->
        <div class="sheet hidden" id="sheet-grant" role="tabpanel" aria-label="부여관리">
          <div class="sheet-body grant-body">
            <div id="grant-container"></div>
          </div>
        </div>

        <!-- Version comparison sheet -->
        <div class="sheet hidden" id="sheet-version" role="tabpanel" aria-label="버전">
          <div class="sheet-body version-body">
            <div id="version-container"></div>
          </div>
        </div>

      </div>

      <!-- ── Bottom: sheet tabs + status bar ──────────────────── -->
      <div class="bottom-bar">
        <div class="sheet-tabs" role="tablist" aria-label="시트 탭">
          <div class="stab active" data-sheet="overview" role="tab" aria-selected="true"><span class="stab-icon">◉</span> 개요</div>
          <div class="stab" data-sheet="service" role="tab" aria-selected="false"><span class="stab-icon">⊞</span> 서비스</div>
          <div class="stab" data-sheet="permission" role="tab" aria-selected="false"><span class="stab-icon">⊙</span> 권한</div>
          <div class="stab" data-sheet="event" role="tab" aria-selected="false"><span class="stab-icon">◈</span> 이벤트</div>
          <div class="stab" data-sheet="scenario" role="tab" aria-selected="false"><span class="stab-icon">▶</span> 시나리오</div>
          <div class="stab" data-sheet="grant" role="tab" aria-selected="false"><span class="stab-icon">⊡</span> 부여관리</div>
          <div class="stab" data-sheet="version" role="tab" aria-selected="false"><span class="stab-icon">◎</span> 버전</div>
        </div>
        <div class="status-bar">
          <span id="status-shape">n차원 참조 주소 체계</span>
          <span class="status-sep">|</span>
          <span id="status-slots">프로젝트 개요</span>
          <span class="status-sep">|</span>
          <span id="status-sel">선택 없음</span>
        </div>
      </div>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
