<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA-SDK Diagram Viewer</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Sora:wght@300;400;600;700&display=swap');

:root {
  --bg: #0d1117;
  --sidebar: #161b22;
  --card: #1c2128;
  --border: #30363d;
  --mint: #64ffda;
  --cyan: #58a6ff;
  --txt: #c9d1d9;
  --dim: #8b949e;
  --hover: #21262d;
  --active: rgba(100, 255, 218, 0.08);
  --nav-h: 36px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--txt);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── Nav Bar ── */
#nav {
  height: var(--nav-h);
  background: var(--sidebar);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 4px;
  flex-shrink: 0;
}

.nav-link {
  padding: 4px 12px;
  font-size: 11px;
  font-weight: 500;
  color: var(--dim);
  text-decoration: none;
  border-radius: 4px;
  transition: all 0.15s;
}

.nav-link:hover { color: var(--txt); background: var(--hover); }
.nav-link.active { color: var(--mint); background: var(--active); }

.nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 8px; }

.nav-brand {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--mint);
  margin-right: 12px;
}

/* ── Layout ── */
#content {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── Sidebar ── */
#sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.sidebar-header h2 {
  font-size: 13px;
  font-weight: 600;
  color: var(--txt);
  letter-spacing: -0.3px;
}

/* ── Search ── */
#search-box {
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#search-input {
  width: 100%;
  padding: 6px 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--txt);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
}

#search-input:focus { outline: none; border-color: var(--mint); }
#search-input::placeholder { color: var(--dim); }

/* ── Preset List ── */
#preset-sections {
  flex: 1;
  overflow-y: auto;
}

.section { padding: 8px 0; border-bottom: 1px solid var(--border); }

.section-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dim);
  padding: 4px 16px 6px;
}

.preset-item {
  display: block;
  width: 100%;
  padding: 7px 16px;
  background: none;
  border: none;
  color: var(--txt);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s;
}

.preset-item:hover { background: var(--hover); }
.preset-item.active { background: var(--active); color: var(--mint); }
.preset-item .item-id { display: block; font-weight: 500; }
.preset-item .item-desc {
  display: block;
  font-family: 'Sora', sans-serif;
  font-size: 10px;
  color: var(--dim);
  margin-top: 2px;
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.preset-item.hidden { display: none; }

/* ── Custom Input ── */
.custom-section { padding: 10px 16px; flex-shrink: 0; border-top: 1px solid var(--border); }
.custom-section h3 {
  font-size: 10px; font-weight: 600; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--dim); margin-bottom: 6px;
}

#custom-input {
  width: 100%; height: 100px;
  background: var(--card); border: 1px solid var(--border); border-radius: 4px;
  color: var(--txt); font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  padding: 8px; resize: vertical;
}
#custom-input:focus { outline: none; border-color: var(--mint); }

#render-btn {
  margin-top: 6px; width: 100%; padding: 7px;
  background: rgba(100, 255, 218, 0.1); border: 1px solid var(--mint); border-radius: 4px;
  color: var(--mint); font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}
#render-btn:hover { background: rgba(100, 255, 218, 0.2); }

/* ── Main Area ── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#main-header {
  padding: 10px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

#diagram-title { font-size: 13px; font-weight: 600; }
.header-actions { display: flex; gap: 8px; }

.action-btn {
  padding: 5px 12px;
  background: var(--card); border: 1px solid var(--border); border-radius: 4px;
  color: var(--dim); font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  cursor: pointer; transition: all 0.15s;
}
.action-btn:hover { border-color: var(--cyan); color: var(--cyan); }

#diagram-container {
  flex: 1;
  overflow: hidden;
  position: relative;
  cursor: grab;
}

#diagram-container.panning { cursor: grabbing; }

#diagram-viewport {
  transform-origin: 0 0;
  padding: 24px;
  display: inline-block;
  min-width: 100%;
  min-height: 100%;
}

#diagram-viewport .mermaid {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 24px;
  min-width: 400px;
}

#zoom-controls {
  position: absolute;
  bottom: 16px;
  right: 16px;
  display: flex;
  gap: 4px;
  z-index: 10;
}

.zoom-btn {
  width: 32px;
  height: 32px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--txt);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.zoom-btn:hover { border-color: var(--cyan); color: var(--cyan); }

#zoom-level {
  font-size: 10px;
  color: var(--dim);
  align-self: center;
  min-width: 36px;
  text-align: center;
}

#empty-state { text-align: center; color: var(--dim); margin-top: 80px; }
#empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
#empty-state p { font-size: 12px; line-height: 1.8; }

#loading { text-align: center; color: var(--dim); padding: 24px; font-size: 11px; }

/* Mermaid 테마 오버라이드 */
.mermaid .actor { fill: #1c2128 !important; stroke: #30363d !important; }
.mermaid text { fill: #c9d1d9 !important; }
.mermaid .messageLine0, .mermaid .messageLine1 { stroke: #58a6ff !important; }
.mermaid .noteText { fill: #c9d1d9 !important; }
.mermaid .note { fill: #21262d !important; stroke: #30363d !important; }
.mermaid rect.rect { fill: rgba(100, 255, 218, 0.04) !important; stroke: rgba(100, 255, 218, 0.15) !important; }
</style>
</head>
<body>

<!-- ── Nav Bar ── -->
<nav id="nav">
  <span class="nav-brand">QA-SDK</span>
  <a class="nav-link" href="/">Demo</a>
  <a class="nav-link" href="/monitor.html">Monitor</a>
  <a class="nav-link active" href="/diagram.html">Diagram</a>
  <a class="nav-link" href="/debugger.html">Debugger</a>
  <a class="nav-link" href="/dashboard.html">Dashboard</a>
  <a class="nav-link" href="/events.html">Events</a>
</nav>

<!-- ── Content ── -->
<div id="content">

<div id="sidebar">
  <div class="sidebar-header">
    <h2>Diagrams</h2>
  </div>

  <div id="search-box">
    <input id="search-input" type="text" placeholder="검색..." />
  </div>

  <div id="trace-section" style="padding:8px 16px;border-bottom:1px solid var(--border);">
    <div style="font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;">TRACE</div>
    <div style="display:flex;gap:4px;">
      <input id="trace-input" type="text" placeholder="trace ID..." style="flex:1;padding:5px 8px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--txt);font-family:'IBM Plex Mono',monospace;font-size:10px;" />
      <button id="trace-btn" style="padding:5px 10px;background:rgba(100,255,218,0.1);border:1px solid var(--mint);border-radius:4px;color:var(--mint);font-size:10px;cursor:pointer;">Load</button>
    </div>
  </div>

  <div id="preset-sections">
    <div id="loading">프리셋 로딩 중...</div>
  </div>

  <div class="custom-section">
    <h3>Custom Mermaid</h3>
    <textarea id="custom-input" placeholder="sequenceDiagram&#10;  Alice ->> Bob: Hello&#10;&#10;Ctrl+Enter로 렌더"></textarea>
    <button id="render-btn">Render (Ctrl+Enter)</button>
  </div>
</div>

<div id="main">
  <div id="main-header">
    <span id="diagram-title">Diagram Viewer</span>
    <div class="header-actions">
      <button class="action-btn" id="btn-copy" disabled>Copy MMD</button>
      <button class="action-btn" id="btn-download" disabled>Download SVG</button>
    </div>
  </div>
  <div id="diagram-container">
    <div id="diagram-viewport">
      <div id="empty-state">
        <div class="icon">&#9671;</div>
        <p>
          사이드바에서 다이어그램을 선택하거나<br>
          Custom 영역에 Mermaid 텍스트를 입력하세요.<br><br>
          <code style="font-size:11px;color:var(--cyan)">qa-sdk dkg diagram list</code>
        </p>
      </div>
    </div>
    <div id="zoom-controls">
      <button class="zoom-btn" id="zoom-out" title="Zoom Out">-</button>
      <span id="zoom-level">100%</span>
      <button class="zoom-btn" id="zoom-in" title="Zoom In">+</button>
      <button class="zoom-btn" id="zoom-fit" title="Fit">&#8690;</button>
      <button class="zoom-btn" id="zoom-reset" title="Reset">1:1</button>
    </div>
  </div>
</div>

</div><!-- /content -->

<script>
// ═══════════════════════════════════════════════════════════════
//  Mermaid Init
// ═══════════════════════════════════════════════════════════════

mermaid.initialize({
  startOnLoad: false,
  theme: 'dark',
  securityLevel: 'loose',
  sequence: { actorMargin: 50, noteMargin: 10 },
});

let currentMmd = '';
let renderCounter = 0;
let presets = {};
let presetsFromApi = false;

// ═══════════════════════════════════════════════════════════════
//  Preset Loading — API 우선, static fallback
// ═══════════════════════════════════════════════════════════════

async function loadPresets() {
  // 1. Try API (live DKG)
  try {
    const _regBase = (window.__QA_CONFIG__||{}).REGISTRY_URL || '';
    const resp = await fetch(`${_regBase}/api/diagrams`);
    if (resp.ok) {
      const data = await resp.json();
      presets = data;
      presetsFromApi = true;
      buildSidebar();
      restoreFromUrl();
      return;
    }
  } catch { /* API not available */ }

  // 2. Fallback to static presets
  try {
    const resp = await fetch('diagram-presets.js');
    if (resp.ok) {
      const text = await resp.text();
      // window.DIAGRAM_PRESETS = {...} 형식 → eval로 파싱
      const fn = new Function(text + '; return window.DIAGRAM_PRESETS;');
      presets = fn() || {};
    }
  } catch {
    presets = {};
  }
  buildSidebar();
  restoreFromUrl();
}

// ═══════════════════════════════════════════════════════════════
//  Sidebar Build
// ═══════════════════════════════════════════════════════════════

const SECTION_LABELS = {
  'intent-links': 'IntentLink',
  'dsl': 'DSL Bundle',
  'table-er': 'Table ER',
  'transition-spec': 'Transition Spec',
  'transition-dag': 'Transition DAG',
};

function buildSidebar() {
  const container = document.getElementById('preset-sections');
  container.innerHTML = '';

  const keys = Object.keys(presets);
  if (keys.length === 0) {
    container.innerHTML = `<div style="padding:16px;color:var(--dim);font-size:11px;line-height:1.6;">
      프리셋이 없습니다.<br><br>
      <code style="color:var(--cyan)">pnpm --filter platform-demo exec tsx scripts/generate-diagram-presets.ts</code>
    </div>`;
    return;
  }

  for (const [key, items] of Object.entries(presets)) {
    if (!items || items.length === 0) continue;

    const section = document.createElement('div');
    section.className = 'section';
    section.dataset.section = key;

    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = `${SECTION_LABELS[key] || key} (${items.length})`;
    section.appendChild(title);

    for (const item of items) {
      const btn = document.createElement('button');
      btn.className = 'preset-item';
      btn.dataset.key = key;
      btn.dataset.id = item.id;
      btn.dataset.search = `${item.id} ${item.label || ''} ${item.description || ''}`.toLowerCase();

      const idSpan = document.createElement('span');
      idSpan.className = 'item-id';
      idSpan.textContent = item.label || item.id;
      btn.appendChild(idSpan);

      if (item.description) {
        const descSpan = document.createElement('span');
        descSpan.className = 'item-desc';
        descSpan.textContent = item.description;
        btn.appendChild(descSpan);
      }

      btn.addEventListener('click', () => selectPreset(key, item));
      section.appendChild(btn);
    }

    container.appendChild(section);
  }
}

// ═══════════════════════════════════════════════════════════════
//  Search
// ═══════════════════════════════════════════════════════════════

document.getElementById('search-input').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.preset-item').forEach(el => {
    el.classList.toggle('hidden', q.length > 0 && !el.dataset.search.includes(q));
  });
});

// ═══════════════════════════════════════════════════════════════
//  Preset Selection + URL State
// ═══════════════════════════════════════════════════════════════

async function selectPreset(key, item) {
  // active 표시
  document.querySelectorAll('.preset-item').forEach(el => el.classList.remove('active'));
  const btn = document.querySelector(`.preset-item[data-key="${key}"][data-id="${item.id}"]`);
  if (btn) btn.classList.add('active');

  const title = item.label || item.id;
  document.getElementById('diagram-title').textContent = title;

  // URL 업데이트 (새로고침 시 복원용)
  const url = new URL(window.location.href);
  url.searchParams.set('preset', item.id);
  url.hash = '';
  history.replaceState(null, '', url);

  if (item.mmd) {
    renderMermaid(item.mmd);
  } else if (presetsFromApi) {
    // API에서 on-demand로 mmd 가져오기
    try {
      const _regBase2 = (window.__QA_CONFIG__||{}).REGISTRY_URL || '';
      const resp = await fetch(`${_regBase2}/api/diagrams/${encodeURIComponent(key)}/${encodeURIComponent(item.id)}`);
      if (resp.ok) {
        const data = await resp.json();
        item.mmd = data.mmd; // 캐시 (다음 클릭 시 재요청 방지)
        renderMermaid(data.mmd);
        return;
      }
    } catch { /* fetch 실패 */ }
    showEmpty('다이어그램을 가져올 수 없습니다.');
  } else {
    showEmpty('Mermaid 텍스트가 없습니다.');
  }
}

function restoreFromUrl() {
  const url = new URL(window.location.href);

  // ?preset=ID 복원
  const presetId = url.searchParams.get('preset');
  if (presetId) {
    for (const [key, items] of Object.entries(presets)) {
      const found = items.find(i => i.id === presetId);
      if (found) { selectPreset(key, found); return; }
    }
  }

  // #base64 복원
  const hash = url.hash.slice(1);
  if (hash) {
    try {
      const mmd = decodeURIComponent(atob(hash));
      document.getElementById('diagram-title').textContent = 'URL Diagram';
      document.getElementById('custom-input').value = mmd;
      renderMermaid(mmd);
    } catch { /* ignore */ }
  }
}

// ═══════════════════════════════════════════════════════════════
//  Render
// ═══════════════════════════════════════════════════════════════

// ── Observed prefix 로딩 (insights API에서) ──
let _observedPrefixes = null;

async function getObservedPrefixes() {
  if (_observedPrefixes) return _observedPrefixes;
  try {
    const base = (window.__QA_CONFIG__||{}).INGEST_URL || (window.__QA_CONFIG__||{}).REGISTRY_URL || '';
    const r = await fetch(`${base}/v1/insights/prefixes`);
    if (r.ok) {
      const data = await r.json();
      _observedPrefixes = {};
      data.forEach(p => { _observedPrefixes[p.prefix] = p.count; });
    }
  } catch { /* insights 없으면 스킵 */ }
  return _observedPrefixes || {};
}

function applyObservedOverlay(viewport) {
  if (!_observedPrefixes) return;
  // sequence diagram participants → <text> 요소에 prefix 이름이 있음
  const texts = viewport.querySelectorAll('text.actor, text');
  const observed = _observedPrefixes;
  texts.forEach(t => {
    const name = (t.textContent || '').trim();
    if (observed[name]) {
      // participant rect 찾기 (이전 sibling 또는 부모 g의 rect)
      const g = t.closest('g');
      if (g) {
        const rect = g.querySelector('rect, line');
        if (rect) {
          rect.style.stroke = '#3fb950';
          rect.style.strokeWidth = '2';
        }
        t.style.fill = '#3fb950';
        t.style.fontWeight = 'bold';
      }
      // observed 카운트 배지 추가
      const badge = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      badge.textContent = `${observed[name]}x`;
      badge.setAttribute('x', t.getAttribute('x') || '0');
      badge.setAttribute('y', String(parseFloat(t.getAttribute('y') || '0') + 14));
      badge.setAttribute('text-anchor', t.getAttribute('text-anchor') || 'middle');
      badge.style.fill = '#3fb950';
      badge.style.fontSize = '10px';
      badge.style.fontFamily = 'monospace';
      t.parentNode?.appendChild(badge);
    }
  });

  // legend 추가
  const svg = viewport.querySelector('svg');
  if (svg) {
    const observedCount = Object.keys(observed).length;
    const allParticipants = new Set();
    texts.forEach(t => { const n = (t.textContent||'').trim(); if (n && n.length > 1) allParticipants.add(n); });
    const matchCount = [...allParticipants].filter(p => observed[p]).length;
    if (matchCount > 0 || allParticipants.size > 0) {
      const legend = document.createElement('div');
      legend.style.cssText = 'position:absolute;bottom:8px;left:8px;font-size:11px;color:#8b949e;background:rgba(13,17,23,0.85);padding:4px 8px;border-radius:4px;z-index:5';
      legend.innerHTML = `<span style="color:#3fb950">●</span> observed (${matchCount}) &nbsp; <span style="color:#8b949e">○</span> unobserved`;
      viewport.style.position = 'relative';
      viewport.appendChild(legend);
    }
  }
}

async function renderMermaid(mmd) {
  currentMmd = mmd;
  const viewport = document.getElementById('diagram-viewport');
  document.getElementById('btn-copy').disabled = false;
  document.getElementById('btn-download').disabled = false;

  try {
    renderCounter++;
    const id = `mmd-${renderCounter}`;
    const { svg } = await mermaid.render(id, mmd);
    viewport.innerHTML = `<div class="mermaid">${svg}</div>`;

    // observed prefix 오버레이 적용
    await getObservedPrefixes();
    applyObservedOverlay(viewport);

    resetZoom();
  } catch (err) {
    viewport.innerHTML = `<div style="padding:24px;color:#f85149;font-family:'IBM Plex Mono',monospace;font-size:12px;">
      <strong>Render Error</strong><br>
      <pre style="margin-top:8px;white-space:pre-wrap;">${err.message || err}</pre>
      <pre style="margin-top:12px;color:var(--dim);white-space:pre-wrap;">${mmd}</pre>
    </div>`;
  }
}

function renderCustom() {
  const text = document.getElementById('custom-input').value.trim();
  if (!text) return;

  document.querySelectorAll('.preset-item').forEach(el => el.classList.remove('active'));
  document.getElementById('diagram-title').textContent = 'Custom Diagram';

  // URL 업데이트 (hash)
  const url = new URL(window.location.href);
  url.searchParams.delete('preset');
  url.hash = btoa(encodeURIComponent(text));
  history.replaceState(null, '', url);

  renderMermaid(text);
}

function showEmpty(msg) {
  document.getElementById('diagram-viewport').innerHTML =
    `<div id="empty-state"><div class="icon">&#9671;</div><p>${msg.replace(/\n/g, '<br>')}</p></div>`;
  currentMmd = '';
  document.getElementById('btn-copy').disabled = true;
  document.getElementById('btn-download').disabled = true;
  resetZoom();
}

// ═══════════════════════════════════════════════════════════════
//  Actions (Copy / Download)
// ═══════════════════════════════════════════════════════════════

document.getElementById('btn-copy').addEventListener('click', function () {
  if (!currentMmd) return;
  const self = this;
  navigator.clipboard.writeText(currentMmd).then(() => {
    const orig = self.textContent;
    self.textContent = 'Copied!';
    self.style.color = 'var(--mint)';
    self.style.borderColor = 'var(--mint)';
    setTimeout(() => { self.textContent = orig; self.style.color = ''; self.style.borderColor = ''; }, 1500);
  });
});

document.getElementById('btn-download').addEventListener('click', function () {
  const svgEl = document.querySelector('#diagram-viewport svg');
  if (!svgEl) return;
  const svgData = new XMLSerializer().serializeToString(svgEl);
  const blob = new Blob([svgData], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'diagram.svg';
  a.click();
  URL.revokeObjectURL(url);
});

// ═══════════════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════════════

document.getElementById('render-btn').addEventListener('click', renderCustom);
document.getElementById('custom-input').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') renderCustom();
});

document.getElementById('trace-btn').addEventListener('click', loadTrace);
document.getElementById('trace-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadTrace();
});

async function loadTrace() {
  const traceId = document.getElementById('trace-input').value.trim();
  if (!traceId) return;
  document.getElementById('diagram-title').textContent = `Trace: ${traceId}`;
  try {
    const resp = await fetch(`/v1/traces/${encodeURIComponent(traceId)}/diagram`);
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      showEmpty(err.error ?? `Trace not found (${resp.status})`);
      return;
    }
    const data = await resp.json();
    renderMermaid(data.mmd);
  } catch {
    showEmpty('ingest-server에 연결할 수 없습니다');
  }
}

// ═══════════════════════════════════════════════════════════════
//  Zoom + Pan
// ═══════════════════════════════════════════════════════════════

let scale = 1;
let panX = 0, panY = 0;
let isPanning = false;
let panStartX = 0, panStartY = 0;

const viewport = document.getElementById('diagram-viewport');
const container = document.getElementById('diagram-container');
const zoomLabel = document.getElementById('zoom-level');

function applyTransform() {
  viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  zoomLabel.textContent = `${Math.round(scale * 100)}%`;
}

function resetZoom() {
  scale = 1; panX = 0; panY = 0;
  applyTransform();
}

function zoomTo(newScale, cx, cy) {
  const clamp = Math.max(0.1, Math.min(5, newScale));
  // 줌 중심점 유지
  panX = cx - (cx - panX) * (clamp / scale);
  panY = cy - (cy - panY) * (clamp / scale);
  scale = clamp;
  applyTransform();
}

function fitToView() {
  const svgEl = viewport.querySelector('svg');
  if (!svgEl) { resetZoom(); return; }
  const cw = container.clientWidth;
  const ch = container.clientHeight;
  const sw = svgEl.scrollWidth || svgEl.clientWidth || 800;
  const sh = svgEl.scrollHeight || svgEl.clientHeight || 600;
  const pad = 48;
  scale = Math.min((cw - pad) / sw, (ch - pad) / sh, 2);
  panX = (cw - sw * scale) / 2;
  panY = (ch - sh * scale) / 2;
  applyTransform();
}

// 휠 줌
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = container.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  zoomTo(scale * delta, cx, cy);
}, { passive: false });

// 마우스 팬
container.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  isPanning = true;
  panStartX = e.clientX - panX;
  panStartY = e.clientY - panY;
  container.classList.add('panning');
});

window.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  panX = e.clientX - panStartX;
  panY = e.clientY - panStartY;
  applyTransform();
});

window.addEventListener('mouseup', () => {
  isPanning = false;
  container.classList.remove('panning');
});

// 터치 팬 (모바일)
let touchStartX = 0, touchStartY = 0;
container.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX - panX;
    touchStartY = e.touches[0].clientY - panY;
  }
}, { passive: true });

container.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1) {
    panX = e.touches[0].clientX - touchStartX;
    panY = e.touches[0].clientY - touchStartY;
    applyTransform();
  }
}, { passive: true });

// 버튼
document.getElementById('zoom-in').addEventListener('click', () => {
  const rect = container.getBoundingClientRect();
  zoomTo(scale * 1.2, rect.width / 2, rect.height / 2);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  const rect = container.getBoundingClientRect();
  zoomTo(scale / 1.2, rect.width / 2, rect.height / 2);
});
document.getElementById('zoom-fit').addEventListener('click', fitToView);
document.getElementById('zoom-reset').addEventListener('click', resetZoom);

// 키보드 단축키
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA') return;
  if ((e.ctrlKey || e.metaKey) && e.key === '=') { e.preventDefault(); document.getElementById('zoom-in').click(); }
  if ((e.ctrlKey || e.metaKey) && e.key === '-') { e.preventDefault(); document.getElementById('zoom-out').click(); }
  if ((e.ctrlKey || e.metaKey) && e.key === '0') { e.preventDefault(); resetZoom(); }
});

loadPresets();
</script>
