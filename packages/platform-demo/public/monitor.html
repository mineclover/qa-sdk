// 실제 mixed-radix encode
function encode(prefixId, values) {
  const def = CATALOG[prefixId];
  if (!def) return null;
  const shape = [], positions = [];
  for (const label of def.labels) {
    const dim = def.dims[label];
    if (dim.kind === 'axis') {
      shape.push(dim.capacity);
      const idx = dim.entries.indexOf(values[label]);
      if (idx < 0) return null;
      positions.push(idx);
    } else if (dim.kind === 'prefix_ref') {
      shape.push(dim.values.length);
      const idx = dim.values.indexOf(values[label]);
      if (idx < 0) return null;
      positions.push(idx);
    }
  }
  const strides = new Array(shape.length);
  strides[shape.length - 1] = 1;
  for (let i = shape.length - 2; i >= 0; i--) strides[i] = strides[i+1] * shape[i+1];
  let addr = 0;
  for (let i = 0; i < positions.length; i++) addr += positions[i] * strides[i];
  return { prefix: prefixId, version: def.version, address: addr, serialized: `${prefixId}:${def.version}:${addr}` };
}

// 실제 mixed-radix decode
function decode(serialized) {
  const [prefixId, version, addrStr] = serialized.split(':');
  const def = CATALOG[prefixId];
  if (!def) return null;
  let addr = parseInt(addrStr);
  const shape = [], labels = [];
  for (const label of def.labels) {
    const dim = def.dims[label];
    if (dim.kind === 'axis') { shape.push(dim.capacity); labels.push({label, dim}); }
    else if (dim.kind === 'prefix_ref') { shape.push(dim.values.length); labels.push({label, dim}); }
  }
  const strides = new Array(shape.length);
  strides[shape.length-1]=1;
  for(let i=shape.length-2;i>=0;i--)strides[i]=strides[i+1]*shape[i+1];
  const result = {};
  for (let i = 0; i < labels.length; i++) {
    const pos = Math.floor(addr / strides[i]); addr %= strides[i];
    const {label, dim} = labels[i];
    result[label] = dim.kind === 'axis' ? (dim.entries[pos] || `(${pos})`) : dim.values[pos];
  }
  return { prefix: prefixId, version, values: result };
}

// Service address for prod/asia/shopping-web/shop
const SVC_WEB = encode('service', {env:'prod',region:'asia',svc_name:'shopping-web',namespace:'shop'}).address;
const SVC_BE = encode('service', {env:'prod',region:'asia',svc_name:'shopping-backend',namespace:'shop'}).address;
const SVC_PAY = encode('service', {env:'prod',region:'asia',svc_name:'payment',namespace:'shop'}).address;

// QaContext-like track function
function track(prefixDims) {
  const ctx = {};
  for (const [prefixId, dims] of Object.entries(prefixDims)) {
    const def = CATALOG[prefixId];
    if (!def) continue;
    const fullDims = { ...dims };
    // Auto-inject svc_ref
    for (const label of def.labels) {
      const dim = def.dims[label];
      if (dim.kind === 'prefix_ref' && !(label in fullDims)) {
        fullDims[label] = dim.values[0]; // default first service
      }
    }
    const result = encode(prefixId, fullDims);
    if (result) ctx[prefixId] = result.serialized;
  }
  return ctx;
}

camera.position.set(30,22,35);

const ctrl=new OrbitControls(camera,canvas);
ctrl.enableDamping=true;ctrl.dampingFactor=0.05;
ctrl.target.set(0,-1,0);ctrl.minDistance=15;ctrl.maxDistance=80;

scene.add(new THREE.AmbientLight(0x141820,3));
const dl=new THREE.DirectionalLight(0xffffff,0.3);dl.position.set(15,30,15);scene.add(dl);

// ═══════════════════════════════════════════════════
//  Build Cell Grid
// ═══════════════════════════════════════════════════

const cellMap={};// "prefix/entry" → {mesh,wire,glow,hits,layer}
const cellSize=0.55;
const cellGap=0.12;
const groupGap=0.8;

function buildGrid(){
  LAYERS.forEach((layer,li)=>{
    let curX=-((layer.groups.reduce((s,g)=>s+g.entries.length,0)*(cellSize+cellGap)+layer.groups.length*groupGap)/2);

    // Layer plane
    const totalW=layer.groups.reduce((s,g)=>s+g.entries.length,0)*(cellSize+cellGap)+layer.groups.length*groupGap+2;
    const maxRows=Math.max(...layer.groups.map(g=>1));
    const planeGeo=new THREE.PlaneGeometry(totalW,2.5);
    const planeMat=new THREE.MeshBasicMaterial({color:layer.color,transparent:true,opacity:0.008,side:THREE.DoubleSide});
    const plane=new THREE.Mesh(planeGeo,planeMat);
    plane.rotation.x=-Math.PI/2;plane.position.set(0,layer.y-0.4,0);
    scene.add(plane);

    // Layer label
    const lblCanvas=document.createElement('canvas');lblCanvas.width=512;lblCanvas.height=64;
    const lctx=lblCanvas.getContext('2d');
    lctx.fillStyle=`#${layer.color.toString(16).padStart(6,'0')}`;lctx.globalAlpha=0.4;
    lctx.font='500 20px JetBrains Mono';lctx.fillText(layer.name,10,40);
    const lblTex=new THREE.CanvasTexture(lblCanvas);lblTex.minFilter=THREE.LinearFilter;
    const lblSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:lblTex,transparent:true}));
    lblSprite.scale.set(8,1.5,1);lblSprite.position.set(curX-2,layer.y+0.6,2);
    scene.add(lblSprite);

    layer.groups.forEach(group=>{
      // Group label
      const gCanvas=document.createElement('canvas');gCanvas.width=256;gCanvas.height=48;
      const gctx=gCanvas.getContext('2d');
      const cc=CAT_COLORS[group.cat]||CAT_COLORS.entity;
      gctx.fillStyle=`#${cc.c.toString(16).padStart(6,'0')}`;gctx.globalAlpha=0.5;
      gctx.font='400 14px JetBrains Mono';gctx.fillText(group.prefix,4,30);
      const gTex=new THREE.CanvasTexture(gCanvas);gTex.minFilter=THREE.LinearFilter;
      const gSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:gTex,transparent:true}));
      gSprite.scale.set(3,0.6,1);
      gSprite.position.set(curX+group.entries.length*(cellSize+cellGap)/2,layer.y+0.4,-1.2);
      scene.add(gSprite);

      group.entries.forEach((entry,ei)=>{
        const x=curX+ei*(cellSize+cellGap);
        const catDef=CAT_COLORS[group.cat]||CAT_COLORS.entity;

        const geo=new THREE.BoxGeometry(cellSize,0.3,cellSize);
        const mat=new THREE.MeshStandardMaterial({
          color:catDef.c,emissive:0x000000,metalness:0.4,roughness:0.6,
          transparent:true,opacity:0.12,
        });
        const mesh=new THREE.Mesh(geo,mat);
        mesh.position.set(x,layer.y,0);
        scene.add(mesh);

        const edgeGeo=new THREE.EdgesGeometry(geo);
        const edgeMat=new THREE.LineBasicMaterial({color:catDef.c,transparent:true,opacity:0.08});
        const wire=new THREE.LineSegments(edgeGeo,edgeMat);
        wire.position.copy(mesh.position);
        scene.add(wire);

        // Entry label (small)
        const eCanvas=document.createElement('canvas');eCanvas.width=128;eCanvas.height=32;
        const ectx=eCanvas.getContext('2d');
        ectx.fillStyle='#778';ectx.font='300 10px JetBrains Mono';
        ectx.textAlign='center';
        const shortLabel=entry.length>10?entry.slice(0,9)+'…':entry;
        ectx.fillText(shortLabel,64,20);
        const eTex=new THREE.CanvasTexture(eCanvas);eTex.minFilter=THREE.LinearFilter;
        const eSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:eTex,transparent:true,opacity:0.5}));
        eSprite.scale.set(1.2,0.3,1);
        eSprite.position.set(x,layer.y-0.35,0.5);
        scene.add(eSprite);

        const key=`${group.prefix}/${entry}`;
        cellMap[key]={mesh,mat,edgeMat,catDef,hits:0,glow:0,layer:li,x,y:layer.y};
      });

      curX+=group.entries.length*(cellSize+cellGap)+groupGap;
    });
  });
}
buildGrid();

// ═══════════════════════════════════════════════════
//  Connection Lines
// ═══════════════════════════════════════════════════

const MAX_LINES=60;
const lines=[];
for(let i=0;i<MAX_LINES;i++){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));
  const mat=new THREE.LineBasicMaterial({color:0x64ffda,transparent:true,opacity:0});
  const line=new THREE.Line(geo,mat);scene.add(line);
  lines.push({geo,mat,life:0});
}
let lineIdx=0;

function spawnLine(a,b){
  if(!a||!b||a.layer===b.layer)return;
  const L=lines[lineIdx%MAX_LINES];lineIdx++;
  const p=L.geo.attributes.position.array;
  p[0]=a.x;p[1]=a.y;p[2]=0;p[3]=b.x;p[4]=b.y;p[5]=0;
  L.geo.attributes.position.needsUpdate=true;
  L.mat.color.setHex(a.catDef.c);L.life=1;
}

// ═══════════════════════════════════════════════════
//  Activate
// ═══════════════════════════════════════════════════

const layerHits=[0,0,0,0];
let totalHits=0;
let activeSet=new Set();

let demoTraceId = 'trc_demo_' + Date.now();
let demoSpanSeq = 0;

function sendToIngest(addressContext, eventKey) {
  const ingestUrl = document.getElementById('ws-url').value
    .replace('ws://','http://').replace('wss://','https://').replace('/v1/ws','/v1/ingest');
  demoSpanSeq++;
  const now = new Date().toISOString();
  const envelope = {
    transmission_id: 'tx_demo_' + Date.now(),
    sent_at: now,
    owner: { owner_type: 'workspace', owner_id: 'monitor-demo' },
    source: { service_name: 'shopping-web', sdk_name: '@qa-sdk/monitor', sdk_version: '0.1.0' },
    runtime: { platform: 'browser' },
    build: { env: 'dev' },
    records: [{
      log_id: 'log_demo_' + Date.now() + '_' + demoSpanSeq,
      timestamp: now,
      record_kind: 'log',
      trace_id: demoTraceId,
      span_id: 'spn_demo_' + demoSpanSeq,
      event_key: eventKey || 'demo.step',
      event_version: '001',
      payload_format: 'json',
      payload_encoding: 'raw',
      payload_masking_applied: false,
      payload_masked_fields: [],
      payload: { step: eventKey },
      address_context: addressContext,
    }],
  };

  fetch(ingestUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(envelope),
  }).then(r => {
    if (!r.ok) console.warn('ingest response:', r.status);
  }).catch(() => {
    // 서버 미가동 시 무시 — 로컬 시각화는 동작
  });
}

function fireStep(step){
  // 1. 실제 encode 실행 → address_context 생성
  const addressContext = step.encode();

  // 1.5. ingest-server에 실제 전송
  sendToIngest(addressContext, step.name);

  // 2. decode → 각 prefix의 실제 값 추출
  const decodedPrefixes = {};
  for (const [prefixId, serialized] of Object.entries(addressContext)) {
    const decoded = decode(serialized);
    if (decoded) decodedPrefixes[prefixId] = decoded;
  }

  // 3. decoded 값을 셀 키로 변환하여 활성화
  const cellKeys = new Set();
  for (const [prefixId, decoded] of Object.entries(decodedPrefixes)) {
    // prefix의 주요 값으로 셀 키 생성
    const vals = Object.values(decoded.values);
    if (prefixId === 'flow_point') {
      cellKeys.add(`flow_point/${decoded.values.flow_name}/${decoded.values.flow_step}`);
      // 약식도 추가
      cellKeys.add(`flow_point/${decoded.values.flow_name}/entry`);
      cellKeys.add(`flow_point/${decoded.values.flow_name}/success`);
    } else if (prefixId === 'endpoint') {
      cellKeys.add(`endpoint/${decoded.values.http_method}/${decoded.values.resource_type}`);
    } else if (prefixId === 'service') {
      const sn = decoded.values.svc_name?.replace('shopping-','') || 'web';
      cellKeys.add(`service/prod/asia/${sn}`);
    } else {
      // 첫 번째 axis 값으로 매칭
      for (const v of Object.values(decoded.values)) {
        cellKeys.add(`${prefixId}/${v}`);
      }
    }
  }
  // 테이블 셀 추가 (encode 대상이 아닌 메타데이터)
  for (const t of (step.tables || [])) cellKeys.add(t);

  activeSet = cellKeys;
  const activated = [];
  for (const key of cellKeys) {
    const cell = cellMap[key];
    if (!cell) continue;
    cell.glow = 2; cell.hits++;
    layerHits[cell.layer]++; totalHits++;
    activated.push(cell);
  }
  for(let i=0;i<activated.length;i++)
    for(let j=i+1;j<activated.length;j++)
      if(activated[i].layer!==activated[j].layer)spawnLine(activated[i],activated[j]);

  // HUD: 실제 address_context 표시
  step._addressContext = addressContext;
  step._decoded = decodedPrefixes;
  step._cells = [...cellKeys];
  updateHUD(step);
}

// ═══════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════

// Layer bars
const barsEl=document.getElementById('layer-bars');
LAYERS.forEach((l,i)=>{
  const cls=['l0','l1','l2','l3'][i];
  barsEl.innerHTML+=`<div class="layer-bar"><div class="layer-bar-label">${l.name}</div><div class="layer-bar-fill"><div class="layer-bar-inner ${cls}-fill" id="bar-${i}" style="width:0%"></div></div><div class="layer-bar-count" id="cnt-${i}">0</div></div>`;
});

function updateHUD(step){
  document.getElementById('hud-step').textContent=step?.name||'--';
  document.getElementById('hud-desc').textContent=step?.desc||'';
  document.getElementById('hud-total').textContent=totalHits;
  const maxH=Math.max(1,...layerHits);
  LAYERS.forEach((_,i)=>{
    document.getElementById(`bar-${i}`).style.width=`${(layerHits[i]/maxH)*100}%`;
    document.getElementById(`cnt-${i}`).textContent=layerHits[i];
  });
  const activeEl=document.getElementById('hud-active');
  if (step?._addressContext) {
    activeEl.innerHTML = Object.entries(step._addressContext).map(([pid, ser]) => {
      return `<span class="hit">${pid}</span> → ${ser}`;
    }).join('<br>');
    if (step.tables?.length) {
      activeEl.innerHTML += '<br>' + step.tables.map(t => `<span style="color:#fd79a8">${t}</span>`).join('<br>');
    }
  } else {
    activeEl.innerHTML = '';
  }
}

// ═══════════════════════════════════════════════════
//  Demo
// ═══════════════════════════════════════════════════

let demoOn=false,demoTimer=null,demoIdx=0;

window.toggleDemo=function(){
  demoOn=!demoOn;
  document.getElementById('btn-demo').classList.toggle('on',demoOn);
  if(demoOn){
    demoIdx=0;
    demoTraceId='trc_demo_'+Date.now();
    demoSpanSeq=0;
    runDemo();
  }else clearTimeout(demoTimer);
};
function runDemo(){
  if(!demoOn)return;
  if(demoIdx>=DEMO_STEPS.length)demoIdx=0;
  fireStep(DEMO_STEPS[demoIdx]);
  document.getElementById('status').textContent=`step ${demoIdx+1}/${DEMO_STEPS.length}`;
  demoIdx++;demoTimer=setTimeout(runDemo,2200);
}

// ═══════════════════════════════════════════════════
//  LIVE Mode — WebSocket → ingest-server 연결
// ═══════════════════════════════════════════════════

let ws = null;
let liveOn = false;

function setConnStatus(label, color) {
  const el = document.getElementById('conn-status');
  el.textContent = `● ${label}`;
  el.style.color = color;
}

window.toggleLive = function() {
  liveOn = !liveOn;
  document.getElementById('btn-live').classList.toggle('on', liveOn);

  if (liveOn) {
    const url = document.getElementById('ws-url').value;
    document.getElementById('status').textContent = `connecting to ${url}...`;
    try {
      ws = new WebSocket(url);
      ws.onopen = () => {
        setConnStatus('connected', '#2ed573');
        document.getElementById('status').textContent = `connected — waiting for events`;
        ws.send(JSON.stringify({ type: 'subscribe', scenarioId: '*' }));
      };
      ws.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === 'record' && msg.data) {
            handleLiveRecord(msg.data);
          } else if (msg.type === 'subscribed') {
            setConnStatus('subscribed', '#64ffda');
            document.getElementById('status').textContent = `subscribed to ${msg.scenarioId} — waiting for events`;
          }
        } catch {}
      };
      ws.onerror = () => {
        setConnStatus('error', '#ff6b6b');
        document.getElementById('status').textContent = `connection error — is ingest-server running on ${url.replace('ws','http').replace('/v1/ws','')}?`;
      };
      ws.onclose = () => {
        setConnStatus(liveOn ? 'reconnecting' : 'disconnected', liveOn ? '#ff9f43' : '#445');
        document.getElementById('status').textContent = liveOn ? `disconnected — retrying in 3s...` : `disconnected`;
        if (liveOn) { liveOn = false; setTimeout(() => { liveOn = true; window.toggleLive(); window.toggleLive(); }, 3000); }
      };
    } catch (e) {
      document.getElementById('status').textContent = `failed: ${e.message}`;
      liveOn = false;
      document.getElementById('btn-live').classList.remove('on');
    }
  } else {
    if (ws) { ws.close(); ws = null; }
    document.getElementById('status').textContent = 'live disconnected';
  }
};

function handleLiveRecord(record) {
  const ctx = record.addressContext || record.address_context;
  if (!ctx || Object.keys(ctx).length === 0) return;

  // 실제 decode → 셀 활성화
  const cellKeys = new Set();
  const decodedPrefixes = {};

  for (const [prefixId, serialized] of Object.entries(ctx)) {
    const decoded = decode(serialized);
    if (!decoded) continue;
    decodedPrefixes[prefixId] = decoded;

    if (prefixId === 'flow_point') {
      cellKeys.add(`flow_point/${decoded.values.flow_name}/entry`);
      cellKeys.add(`flow_point/${decoded.values.flow_name}/success`);
    } else if (prefixId === 'endpoint') {
      cellKeys.add(`endpoint/${decoded.values.http_method}/${decoded.values.resource_type}`);
    } else if (prefixId === 'service') {
      const sn = decoded.values.svc_name?.replace('shopping-','') || 'web';
      cellKeys.add(`service/prod/asia/${sn}`);
    } else {
      for (const v of Object.values(decoded.values)) {
        cellKeys.add(`${prefixId}/${v}`);
      }
    }
  }

  activeSet = cellKeys;
  const activated = [];
  for (const key of cellKeys) {
    const cell = cellMap[key];
    if (!cell) continue;
    cell.glow = 2; cell.hits++;
    layerHits[cell.layer]++; totalHits++;
    activated.push(cell);
  }
  for(let i=0;i<activated.length;i++)
    for(let j=i+1;j<activated.length;j++)
      if(activated[i].layer!==activated[j].layer)spawnLine(activated[i],activated[j]);

  const step = {
    name: record.eventKey || record.event_key || 'live',
    desc: `trace:${(record.traceId||record.trace_id||'').slice(0,12)}`,
    _addressContext: ctx,
    _decoded: decodedPrefixes,
    tables: [],
  };
  updateHUD(step);
  document.getElementById('status').textContent = `live — ${totalHits} events received`;
}

window.resetAll=function(){
  demoOn=false;clearTimeout(demoTimer);
  document.getElementById('btn-demo').classList.remove('on');
  totalHits=0;layerHits.fill(0);activeSet.clear();
  Object.values(cellMap).forEach(c=>{c.hits=0;c.glow=0;});
  updateHUD(null);document.getElementById('status').textContent='reset';
};

// ═══════════════════════════════════════════════════
//  Render Loop
// ═══════════════════════════════════════════════════

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();
  const t=clock.elapsedTime;

  Object.entries(cellMap).forEach(([key,cell])=>{
    cell.glow=Math.max(0,cell.glow-dt*1.2);
    const isActive=activeSet.has(key);
    const pulse=isActive?0.4+Math.sin(t*5)*0.2:0;
    const intensity=Math.max(cell.glow,pulse);

    cell.mat.emissive.setHex(cell.catDef.e);
    cell.mat.emissiveIntensity=intensity*3;
    cell.mat.opacity=0.12+intensity*0.7;
    cell.edgeMat.opacity=0.08+intensity*0.9;
  });

  lines.forEach(l=>{
    if(l.life>0){l.life-=dt*0.5;l.mat.opacity=Math.max(0,l.life*0.35);}
  });

  ctrl.update();
  renderer.render(scene,camera);
}
animate();
document.getElementById('status').textContent='ready — press DEMO';

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
