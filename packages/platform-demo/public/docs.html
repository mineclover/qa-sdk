<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA-SDK 문서 탐색기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; display: flex; height: 100vh; }

  /* 사이드바 */
  #sidebar { width: 380px; border-right: 1px solid #30363d; display: flex; flex-direction: column; flex-shrink: 0; }
  #breadcrumb { padding: 10px 16px; border-bottom: 1px solid #30363d; font-size: 13px; color: #8b949e; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; min-height: 40px; }
  #breadcrumb span { cursor: pointer; color: #58a6ff; }
  #breadcrumb span:hover { text-decoration: underline; }
  #breadcrumb .sep { color: #484f58; cursor: default; }
  #breadcrumb .current { color: #e6edf3; cursor: default; font-weight: 500; }
  #tree { flex: 1; overflow-y: auto; padding: 4px 0; }

  .node { padding: 8px 16px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.1s; }
  .node:hover { background: #161b22; }
  .node.selected { background: #1c2128; border-left-color: #58a6ff; }
  .node-title { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
  .node-purpose { font-size: 12px; color: #8b949e; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .node-meta { font-size: 11px; color: #484f58; margin-top: 2px; }

  .scope-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
  .scope-constraint { background: #f8514926; color: #f85149; }
  .scope-state { background: #a371f726; color: #a371f7; }
  .scope-data { background: #f0883e26; color: #f0883e; }
  .scope-feature { background: #3fb95026; color: #3fb950; }
  .scope-flow { background: #58a6ff26; color: #58a6ff; }
  .scope-interface { background: #79c0ff26; color: #79c0ff; }
  .scope-ui { background: #d2a8ff26; color: #d2a8ff; }

  /* 탭 */
  #tab-bar { display: flex; border-bottom: 1px solid #30363d; }
  .tab { padding: 8px 16px; font-size: 13px; cursor: pointer; color: #8b949e; border-bottom: 2px solid transparent; }
  .tab:hover { color: #e6edf3; }
  .tab.active { color: #e6edf3; border-bottom-color: #58a6ff; }

  /* 메인 */
  #main { flex: 1; overflow-y: auto; }
  #detail { padding: 28px 40px; display: none; }
  #detail h1 { font-size: 22px; margin-bottom: 6px; }
  #detail .meta-bar { font-size: 13px; color: #8b949e; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #detail .path-display { font-size: 12px; color: #484f58; margin-bottom: 16px; font-family: monospace; }
  .section { margin-bottom: 20px; }
  .section h2 { font-size: 15px; color: #58a6ff; margin-bottom: 6px; border-bottom: 1px solid #21262d; padding-bottom: 3px; }
  .section pre { background: #161b22; padding: 12px 16px; border-radius: 6px; overflow-x: auto; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .section p { font-size: 14px; line-height: 1.6; margin-bottom: 6px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: #30363d; color: #8b949e; margin-right: 3px; }
  .link-item { font-size: 13px; padding: 3px 0; }
  .link-item a { color: #58a6ff; cursor: pointer; text-decoration: none; }
  .link-item a:hover { text-decoration: underline; }
  .link-type { color: #8b949e; font-size: 11px; }
  .members { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .member-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px 12px; cursor: pointer; transition: border-color 0.1s; }
  .member-card:hover { border-color: #58a6ff; }
  .member-card .mc-title { font-size: 13px; font-weight: 500; display: flex; gap: 4px; align-items: center; }
  .member-card .mc-purpose { font-size: 12px; color: #8b949e; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* 통계 뷰 */
  #stats-view { padding: 28px 40px; display: none; }
  #stats-view h1 { font-size: 22px; margin-bottom: 20px; }
  .chart-section { margin-bottom: 28px; }
  .chart-section h2 { font-size: 15px; color: #58a6ff; margin-bottom: 10px; }
  .bar-chart { display: flex; flex-direction: column; gap: 6px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .bar-label { width: 120px; text-align: right; color: #8b949e; flex-shrink: 0; }
  .bar-track { flex: 1; height: 22px; background: #161b22; border-radius: 4px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 600; }
  .bar-count { width: 50px; text-align: right; color: #8b949e; flex-shrink: 0; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; text-align: center; }
  .stat-card .num { font-size: 28px; font-weight: 700; color: #58a6ff; }
  .stat-card .label { font-size: 12px; color: #8b949e; margin-top: 4px; }

  #empty { text-align: center; margin-top: 100px; color: #484f58; font-size: 15px; }

  #search-box { padding: 8px 16px; border-bottom: 1px solid #30363d; }
  #search-box input { width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 6px 10px; color: #e6edf3; font-size: 13px; outline: none; }
  #search-box input:focus { border-color: #58a6ff; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="search-box"><input id="search" placeholder="문서 검색..." /></div>
  <div id="breadcrumb"></div>
  <div id="tree"></div>
</div>
<div id="main">
  <div id="tab-bar">
    <div class="tab active" data-view="detail" onclick="switchTab('detail')">문서</div>
    <div class="tab" data-view="stats" onclick="switchTab('stats')">통계</div>
  </div>
  <div id="detail"><div id="empty">← 문서를 선택하세요</div></div>
  <div id="stats-view"></div>
</div>

<script>
const SCOPE_ORDER = ['constraint','state','data','feature','flow','interface','ui'];
const SCOPE_COLORS = {constraint:'#f85149',state:'#a371f7',data:'#f0883e',feature:'#3fb950',flow:'#58a6ff',interface:'#79c0ff',ui:'#d2a8ff'};

let DATA = null;
let nodeMap = {};
let currentPath = [];
let selectedId = null;

async function init() {
  const resp = await fetch('/def-catalog-data.json');
  DATA = await resp.json();
  DATA.nodes.forEach(n => nodeMap[n.id] = n);

  // URL hash에서 경로 복원
  const hash = location.hash.replace('#', '');
  if (hash && nodeMap[hash]) {
    restorePath(hash);
    renderDetail(hash);
    selectedId = hash;
  } else {
    navigate('system-root');
  }
  renderStats();
}

function restorePath(targetId) {
  // target까지의 contains 경로 찾기
  const path = [];
  let cur = targetId;
  const visited = new Set();
  while (cur && !visited.has(cur)) {
    visited.add(cur);
    const node = nodeMap[cur];
    if (!node) break;
    path.unshift({ id: cur, title: node.title });
    cur = node.parents[0];
  }
  currentPath = path;
  renderBreadcrumb();
  const parentId = path.length >= 2 ? path[path.length - 2].id : path[0]?.id;
  if (parentId) renderTree(parentId);
}

function navigate(groupId) {
  const node = nodeMap[groupId];
  if (!node) return;

  const idx = currentPath.findIndex(p => p.id === groupId);
  if (idx >= 0) {
    currentPath = currentPath.slice(0, idx + 1);
  } else {
    currentPath.push({ id: groupId, title: node.title });
  }

  // URL 갱신
  location.hash = groupId;

  renderBreadcrumb();
  renderTree(groupId);
}

function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  el.innerHTML = '';
  currentPath.forEach((p, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '›';
      el.appendChild(sep);
    }
    const span = document.createElement('span');
    span.textContent = p.title;
    if (i === currentPath.length - 1) {
      span.className = 'current';
    } else {
      span.onclick = () => navigate(p.id);
    }
    el.appendChild(span);
  });
}

function renderTree(groupId) {
  const group = nodeMap[groupId];
  const tree = document.getElementById('tree');
  tree.innerHTML = '';

  const members = (group.contains || [])
    .map(id => nodeMap[id]).filter(Boolean)
    .sort((a, b) => SCOPE_ORDER.indexOf(a.scope) - SCOPE_ORDER.indexOf(b.scope));

  members.forEach(m => {
    const div = document.createElement('div');
    div.className = 'node' + (m.id === selectedId ? ' selected' : '');
    div.innerHTML = `
      <div class="node-title">
        ${m.isGroup ? '📁' : '📄'}
        <span class="scope-badge scope-${m.scope}">${m.scope}</span>
        ${esc(m.title)}
      </div>
      <div class="node-purpose">${esc(m.purpose || '')}</div>
      <div class="node-meta">${m.depth}${m.tags.length ? ' · ' + m.tags.slice(0,3).join(', ') : ''}</div>
    `;
    div.onclick = () => selectNode(m.id, groupId);
    tree.appendChild(div);
  });
}

function selectNode(id, parentGroupId) {
  selectedId = id;
  const node = nodeMap[id];
  if (node.isGroup) {
    navigate(id);
  } else {
    renderTree(parentGroupId || currentPath[currentPath.length - 1]?.id);
  }
  location.hash = id;
  renderDetail(id);
  switchTab('detail');
}

function buildPathString(docId) {
  const parts = [];
  let cur = docId;
  const visited = new Set();
  while (cur && !visited.has(cur)) {
    visited.add(cur);
    const n = nodeMap[cur];
    if (!n) break;
    parts.unshift(n.id);
    cur = n.parents[0];
  }
  return parts.join(' › ');
}

function renderDetail(docId) {
  const node = nodeMap[docId];
  if (!node) return;
  const el = document.getElementById('detail');

  let html = `<h1>${esc(node.title)}</h1>`;
  html += `<div class="path-display">${esc(buildPathString(docId))}</div>`;
  html += `<div class="meta-bar">
    <span class="scope-badge scope-${node.scope}">${node.scope}/${node.aspect}</span>
    <span>depth: ${node.depth}</span>
    ${node.serviceId ? `<span>svc: ${node.serviceId}</span>` : ''}
    ${node.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}
  </div>`;

  if (node.purpose) html += `<div class="section"><h2>목적</h2><p>${esc(node.purpose)}</p></div>`;
  if (node.overview) html += `<div class="section"><h2>구성</h2><p>${esc(node.overview)}</p></div>`;

  if (node.isGroup && node.contains.length > 0) {
    const members = node.contains.map(id => nodeMap[id]).filter(Boolean)
      .sort((a, b) => SCOPE_ORDER.indexOf(a.scope) - SCOPE_ORDER.indexOf(b.scope));
    html += `<div class="section"><h2>멤버 (${members.length})</h2><div class="members">`;
    members.forEach(m => {
      html += `<div class="member-card" onclick="selectNode('${m.id}','${docId}')">
        <div class="mc-title"><span class="scope-badge scope-${m.scope}">${m.scope}</span> ${esc(m.title)}</div>
        <div class="mc-purpose">${esc(m.purpose || '')}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  if (node.links.length > 0) {
    html += `<div class="section"><h2>관계</h2>`;
    node.links.forEach(l => {
      const t = nodeMap[l.target];
      html += `<div class="link-item"><span class="link-type">[${l.type}]</span> <a onclick="selectNode('${l.target}')">${esc(t ? t.title : l.target)}</a></div>`;
    });
    html += `</div>`;
  }

  if (node.parents.length > 0) {
    html += `<div class="section"><h2>소속</h2>`;
    node.parents.forEach(pid => {
      const p = nodeMap[pid];
      html += `<div class="link-item"><a onclick="navigate('${pid}');renderDetail('${pid}')">${esc(p ? p.title : pid)}</a></div>`;
    });
    html += `</div>`;
  }

  if (node.body) html += `<div class="section"><h2>전문</h2><pre>${esc(node.body)}</pre></div>`;

  el.innerHTML = html;
  el.style.display = 'block';
}

function renderStats() {
  const el = document.getElementById('stats-view');
  const nodes = DATA.nodes.filter(n => n.lifecycle !== 'deprecated');
  const groups = nodes.filter(n => n.isGroup);
  const total = nodes.length;

  // scope 분포
  const byScope = {};
  nodes.forEach(n => byScope[n.scope] = (byScope[n.scope] || 0) + 1);

  // aspect 분포
  const byAspect = {};
  nodes.forEach(n => byAspect[n.aspect] = (byAspect[n.aspect] || 0) + 1);

  // depth 분포
  const byDepth = {};
  nodes.forEach(n => byDepth[n.depth] = (byDepth[n.depth] || 0) + 1);

  // tags 분포 (상위)
  const byTag = {};
  nodes.forEach(n => (n.tags || []).forEach(t => byTag[t] = (byTag[t] || 0) + 1));

  let html = `<h1>문서 유형 통계</h1>`;

  // 요약 카드
  html += `<div class="stat-grid">
    <div class="stat-card"><div class="num">${total}</div><div class="label">approved 문서</div></div>
    <div class="stat-card"><div class="num">${groups.length}</div><div class="label">그룹</div></div>
    <div class="stat-card"><div class="num">${total - groups.length}</div><div class="label">리프</div></div>
    <div class="stat-card"><div class="num">${Object.keys(byScope).length}</div><div class="label">scope 사용</div></div>
  </div>`;

  // scope 분포
  html += `<div class="chart-section"><h2>Scope 분포</h2><div class="bar-chart">`;
  const maxScope = Math.max(...Object.values(byScope));
  SCOPE_ORDER.forEach(s => {
    const count = byScope[s] || 0;
    const pct = (count / total * 100).toFixed(1);
    html += `<div class="bar-row">
      <div class="bar-label"><span class="scope-badge scope-${s}">${s}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${count/maxScope*100}%;background:${SCOPE_COLORS[s]}30;color:${SCOPE_COLORS[s]}">${pct}%</div></div>
      <div class="bar-count">${count}</div>
    </div>`;
  });
  html += `</div></div>`;

  // depth 분포
  html += `<div class="chart-section"><h2>Depth 분포</h2><div class="bar-chart">`;
  const depthOrder = ['overview','specification','implementation','validation'];
  const maxDepth = Math.max(...Object.values(byDepth));
  depthOrder.forEach(d => {
    const count = byDepth[d] || 0;
    const pct = (count / total * 100).toFixed(1);
    html += `<div class="bar-row">
      <div class="bar-label">${d}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${count/maxDepth*100}%;background:#58a6ff30;color:#58a6ff">${pct}%</div></div>
      <div class="bar-count">${count}</div>
    </div>`;
  });
  html += `</div></div>`;

  // aspect 분포 (상위 10)
  html += `<div class="chart-section"><h2>Aspect 분포 (상위 10)</h2><div class="bar-chart">`;
  const aspectSorted = Object.entries(byAspect).sort((a,b) => b[1]-a[1]).slice(0, 10);
  const maxAspect = aspectSorted[0]?.[1] || 1;
  aspectSorted.forEach(([a, count]) => {
    const pct = (count / total * 100).toFixed(1);
    const scope = SCOPE_ORDER.find(s => DATA.nodes.find(n => n.aspect === a && n.scope === s)) || 'flow';
    html += `<div class="bar-row">
      <div class="bar-label">${a}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${count/maxAspect*100}%;background:${SCOPE_COLORS[scope]}30;color:${SCOPE_COLORS[scope]}">${pct}%</div></div>
      <div class="bar-count">${count}</div>
    </div>`;
  });
  html += `</div></div>`;

  // 태그 분포 (상위 10)
  html += `<div class="chart-section"><h2>태그 분포 (상위 10)</h2><div class="bar-chart">`;
  const tagSorted = Object.entries(byTag).sort((a,b) => b[1]-a[1]).slice(0, 10);
  const maxTag = tagSorted[0]?.[1] || 1;
  tagSorted.forEach(([t, count]) => {
    html += `<div class="bar-row">
      <div class="bar-label">${t}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${count/maxTag*100}%;background:#3fb95030;color:#3fb950">${count}</div></div>
      <div class="bar-count">${count}</div>
    </div>`;
  });
  html += `</div></div>`;

  el.innerHTML = html;
}

function switchTab(view) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  document.getElementById('detail').style.display = view === 'detail' ? 'block' : 'none';
  document.getElementById('stats-view').style.display = view === 'stats' ? 'block' : 'none';
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 검색
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  if (!q) {
    const last = currentPath[currentPath.length - 1];
    if (last) renderTree(last.id);
    return;
  }
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  DATA.nodes.filter(n =>
    n.lifecycle !== 'deprecated' &&
    (n.title.toLowerCase().includes(q) || n.id.includes(q) || (n.purpose||'').toLowerCase().includes(q))
  ).slice(0, 30).forEach(m => {
    const div = document.createElement('div');
    div.className = 'node';
    div.innerHTML = `
      <div class="node-title">${m.isGroup?'📁':'📄'} <span class="scope-badge scope-${m.scope}">${m.scope}</span> ${esc(m.title)}</div>
      <div class="node-purpose">${esc(m.purpose || '')}</div>
    `;
    div.onclick = () => { selectNode(m.id, m.parents[0]); e.target.value = ''; };
    tree.appendChild(div);
  });
});

// hash 변경 시
window.addEventListener('hashchange', () => {
  const id = location.hash.replace('#', '');
  if (id && nodeMap[id] && id !== selectedId) {
    restorePath(id);
    renderDetail(id);
    selectedId = id;
  }
});

init();
</script>
</body>
</html>
