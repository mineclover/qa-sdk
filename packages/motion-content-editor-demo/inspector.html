<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene Inspector - Motion Content Editor</title>
    <style>
      :root {
        --ins-bg-page: #0c1016;
        --ins-bg-canvas: #121820;
        --ins-bg-pane: #131922;
        --ins-bg-section: rgba(255,255,255,0.04);
        --ins-bg-hover: rgba(255,255,255,0.06);
        --ins-bg-selected: rgba(240,143,32,0.12);
        --ins-border: rgba(255,255,255,0.08);
        --ins-border-strong: rgba(255,255,255,0.14);
        --ins-text: #eef3f8;
        --ins-text-muted: rgba(238,243,248,0.55);
        --ins-text-dim: rgba(238,243,248,0.38);
        --ins-accent: #f08f20;
        --ins-accent-soft: rgba(240,143,32,0.18);
        --ins-green: #53c67a;
        --ins-blue: #4bb7ff;
        --ins-red: #ff7f6b;
        --ins-purple: #b48eff;
        --ins-font: "JetBrains Mono", "Fira Code", "SF Mono", monospace;
        --ins-radius: 10px;
        --ins-radius-sm: 6px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--ins-font);
        background: var(--ins-bg-page);
        color: var(--ins-text);
        min-height: 100vh;
      }

      /* -- 상단 네비게이션 -- */
      .ins-topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 24px;
        border-bottom: 1px solid var(--ins-border);
        background: var(--ins-bg-canvas);
      }
      .ins-topbar__title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .ins-topbar__nav {
        display: flex;
        gap: 4px;
      }
      .ins-topbar__nav a {
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 12px;
        text-decoration: none;
        color: var(--ins-text-muted);
        border: 1px solid transparent;
        transition: all 0.15s;
      }
      .ins-topbar__nav a:hover {
        color: var(--ins-text);
        background: var(--ins-bg-hover);
      }
      .ins-topbar__nav a.is-active {
        color: var(--ins-accent);
        border-color: var(--ins-accent-soft);
        background: var(--ins-accent-soft);
      }
      .ins-topbar__spacer { flex: 1; }
      .ins-topbar__meta {
        font-size: 11px;
        color: var(--ins-text-dim);
        letter-spacing: 0.06em;
      }

      /* -- 전체 레이아웃: 좌(트리) + 우(디테일) -- */
      .ins-layout {
        display: grid;
        grid-template-columns: 380px 1fr;
        min-height: calc(100vh - 49px);
      }

      /* -- 좌측: 트리 패널 -- */
      .ins-tree-panel {
        border-right: 1px solid var(--ins-border);
        background: var(--ins-bg-pane);
        overflow-y: auto;
        padding: 16px 0;
      }
      .ins-tree-panel__header {
        padding: 0 20px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ins-tree-panel__header h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--ins-text-muted);
        font-weight: 500;
      }
      .ins-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 20px;
        padding: 0 6px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        background: var(--ins-bg-section);
        color: var(--ins-text-muted);
      }

      /* -- 트리 노드 -- */
      .ins-node {
        user-select: none;
      }
      .ins-node__row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 20px;
        cursor: pointer;
        transition: background 0.1s;
        border-left: 2px solid transparent;
      }
      .ins-node__row:hover {
        background: var(--ins-bg-hover);
      }
      .ins-node__row.is-selected {
        background: var(--ins-bg-selected);
        border-left-color: var(--ins-accent);
      }
      .ins-node__toggle {
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: var(--ins-text-dim);
        flex-shrink: 0;
        transition: transform 0.15s;
      }
      .ins-node__toggle.is-expanded { transform: rotate(90deg); }
      .ins-node__toggle.is-leaf { visibility: hidden; }
      .ins-node__icon {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        flex-shrink: 0;
        font-weight: 700;
      }
      .ins-node__icon--composition { background: var(--ins-accent-soft); color: var(--ins-accent); }
      .ins-node__icon--target { background: rgba(75,183,255,0.15); color: var(--ins-blue); }
      .ins-node__icon--scene { background: rgba(83,198,122,0.15); color: var(--ins-green); }
      .ins-node__icon--placement { background: rgba(180,142,255,0.15); color: var(--ins-purple); }
      .ins-node__icon--sequence { background: rgba(255,127,107,0.15); color: var(--ins-red); }
      .ins-node__icon--caption { background: rgba(238,243,248,0.08); color: var(--ins-text-muted); }
      .ins-node__icon--parameter { background: rgba(240,143,32,0.12); color: var(--ins-accent); }
      .ins-node__icon--asset { background: rgba(238,243,248,0.08); color: var(--ins-text-muted); }
      .ins-node__icon--cue { background: rgba(75,183,255,0.12); color: var(--ins-blue); }
      .ins-node__label {
        font-size: 12px;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ins-node__meta {
        font-size: 10px;
        color: var(--ins-text-dim);
        white-space: nowrap;
        flex-shrink: 0;
      }
      .ins-node__children {
        padding-left: 16px;
      }
      .ins-node__children.is-collapsed {
        display: none;
      }

      /* -- 구분선 -- */
      .ins-divider {
        height: 1px;
        background: var(--ins-border);
        margin: 8px 20px;
      }

      /* -- 우측: 디테일 패널 -- */
      .ins-detail {
        overflow-y: auto;
        padding: 24px;
      }
      .ins-detail__empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--ins-text-dim);
        font-size: 13px;
      }
      .ins-detail__header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--ins-border);
      }
      .ins-detail__header h2 {
        font-size: 16px;
        font-weight: 600;
      }
      .ins-detail__type-badge {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 3px 10px;
        border-radius: 999px;
      }

      /* -- 프로퍼티 테이블 -- */
      .ins-props {
        display: grid;
        gap: 1px;
        background: var(--ins-border);
        border-radius: var(--ins-radius);
        overflow: hidden;
        margin-bottom: 20px;
      }
      .ins-props__section-title {
        grid-column: 1 / -1;
        padding: 8px 16px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--ins-text-muted);
        background: var(--ins-bg-pane);
        font-weight: 600;
      }
      .ins-prop {
        display: grid;
        grid-template-columns: 140px 1fr;
        background: var(--ins-bg-canvas);
      }
      .ins-prop__key {
        padding: 8px 16px;
        font-size: 11px;
        color: var(--ins-text-muted);
        background: var(--ins-bg-pane);
        display: flex;
        align-items: center;
      }
      .ins-prop__value {
        padding: 8px 16px;
        font-size: 12px;
        word-break: break-all;
      }
      .ins-prop__value--mono {
        font-family: var(--ins-font);
        color: var(--ins-blue);
      }
      .ins-prop__value--timing {
        color: var(--ins-green);
      }
      .ins-prop__value--dim {
        color: var(--ins-text-dim);
      }

      /* -- JSON raw view -- */
      .ins-json-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid var(--ins-border-strong);
        background: transparent;
        color: var(--ins-text-muted);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
        margin-bottom: 12px;
      }
      .ins-json-toggle:hover { color: var(--ins-text); background: var(--ins-bg-hover); }
      .ins-json-block {
        padding: 16px;
        border-radius: var(--ins-radius);
        background: var(--ins-bg-pane);
        border: 1px solid var(--ins-border);
        font-size: 11px;
        line-height: 1.6;
        overflow-x: auto;
        white-space: pre-wrap;
        color: var(--ins-text-muted);
        max-height: 400px;
        overflow-y: auto;
      }

      /* -- Workspace 셀렉터 바 -- */
      .ins-workspace-bar {
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .ins-workspace-bar label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ins-text-muted);
      }
      .ins-workspace-bar input,
      .ins-workspace-bar select {
        height: 32px;
        border-radius: 999px;
        border: 1px solid var(--ins-border-strong);
        background: var(--ins-bg-section);
        color: var(--ins-text);
        padding: 0 12px;
        font: inherit;
        font-size: 12px;
        min-width: 140px;
      }
      .ins-workspace-bar button {
        height: 32px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--ins-border-strong);
        background: transparent;
        color: var(--ins-text-muted);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .ins-workspace-bar button:hover {
        color: var(--ins-text);
        background: var(--ins-bg-hover);
      }
      .ins-workspace-bar button.is-primary {
        background: var(--ins-accent);
        color: #111820;
        border-color: transparent;
        font-weight: 600;
      }
      .ins-workspace-bar__status {
        font-size: 11px;
        color: var(--ins-text-dim);
      }
      .ins-workspace-bar__status.is-ok { color: var(--ins-green); }
      .ins-workspace-bar__status.is-error { color: var(--ins-red); }

      /* -- 타임라인 바 (하단 수평 바) -- */
      .ins-timeline-bar {
        border-top: 1px solid var(--ins-border);
        background: var(--ins-bg-pane);
        padding: 16px 24px;
        overflow-x: auto;
      }
      .ins-timeline-bar__label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--ins-text-dim);
        margin-bottom: 10px;
      }
      .ins-timeline-track {
        position: relative;
        height: 36px;
        background: var(--ins-bg-section);
        border-radius: var(--ins-radius-sm);
        border: 1px solid var(--ins-border);
        min-width: 100%;
      }
      .ins-timeline-block {
        position: absolute;
        top: 4px;
        height: 28px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        padding: 0 8px;
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        transition: opacity 0.15s;
        border: 1px solid transparent;
      }
      .ins-timeline-block:hover {
        opacity: 0.85;
      }
      .ins-timeline-block.is-selected {
        border-color: #fff;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.3);
      }
      .ins-timeline-ruler {
        display: flex;
        justify-content: space-between;
        font-size: 9px;
        color: var(--ins-text-dim);
        margin-top: 4px;
        padding: 0 2px;
      }
    </style>
  </head>
  <body>
    <div id="inspector"></div>
    <script type="module" src="/src/inspector.ts"></script>
  </body>
</html>
