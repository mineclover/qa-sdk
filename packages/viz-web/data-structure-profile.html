<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Structure Profile Lineage</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, sans-serif;
        background: #f6f7f8;
        color: #18212b;
      }
      header {
        background: #172026;
        color: #fff;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      header h1 { font-size: 18px; font-weight: 650; }
      header .subtitle { color: #a7b4bf; font-size: 13px; }
      .main {
        display: grid;
        grid-template-columns: 268px minmax(0, 1fr) 284px;
        height: calc(100vh - 49px);
        min-height: 620px;
      }
      .sidebar,
      .inspector {
        background: #fff;
        overflow-y: auto;
      }
      .sidebar {
        border-right: 1px solid #d9e0e6;
        padding: 14px;
      }
      .inspector {
        border-left: 1px solid #d9e0e6;
        padding: 14px;
      }
      .sidebar h2,
      .inspector h2 {
        color: #52606c;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .example-item {
        border: 1px solid transparent;
        border-radius: 6px;
        cursor: pointer;
        margin-bottom: 6px;
        padding: 10px;
      }
      .example-item:hover { background: #eef7f5; }
      .example-item.active {
        background: #e4f4f0;
        border-color: #0f766e;
      }
      .example-item .name { font-size: 13px; font-weight: 650; }
      .example-item .desc {
        color: #667582;
        font-size: 12px;
        line-height: 1.35;
        margin-top: 3px;
      }
      .viewer {
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 12px 16px;
        background: #fff;
        border-bottom: 1px solid #d9e0e6;
      }
      .stat {
        min-width: 96px;
        border: 1px solid #dce5e9;
        border-radius: 6px;
        padding: 8px 10px;
        background: #fbfcfd;
      }
      .stat .val {
        color: #0f766e;
        font-size: 19px;
        font-weight: 750;
      }
      .stat .key {
        color: #63717d;
        font-size: 11px;
        margin-top: 1px;
      }
      .tabs {
        display: flex;
        gap: 2px;
        background: #fff;
        border-bottom: 1px solid #d9e0e6;
        padding: 0 16px;
      }
      .tab {
        color: #53616e;
        cursor: pointer;
        font-size: 13px;
        padding: 9px 15px;
        border-bottom: 2px solid transparent;
      }
      .tab.active {
        border-bottom-color: #0f766e;
        color: #0b5e58;
        font-weight: 650;
      }
      .tab-content {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 16px;
      }
      .tab-pane { display: none; }
      .tab-pane.active { display: block; }
      #svg-container {
        min-width: 980px;
        overflow: auto;
      }
      #svg-container svg {
        background: #fff;
        border: 1px solid #dce5e9;
        border-radius: 8px;
        max-width: 100%;
      }
      pre {
        background: #172026;
        border-radius: 8px;
        color: #dbe4ea;
        font: 12px/1.6 "SF Mono", "Fira Code", monospace;
        overflow: auto;
        padding: 16px;
        position: relative;
      }
      .copy-btn {
        background: #26333d;
        border: 1px solid #40505d;
        border-radius: 4px;
        color: #fff;
        cursor: pointer;
        font-size: 11px;
        padding: 4px 10px;
        position: absolute;
        right: 8px;
        top: 8px;
      }
      .measurement {
        display: grid;
        gap: 8px;
        margin-bottom: 18px;
      }
      .metric {
        align-items: center;
        border-bottom: 1px solid #e7ecef;
        display: flex;
        gap: 10px;
        justify-content: space-between;
        padding: 8px 0;
      }
      .metric span {
        color: #65737f;
        font-size: 12px;
      }
      .metric strong {
        color: #16242d;
        font-size: 13px;
      }
      .diagnostic-list {
        display: grid;
        gap: 8px;
      }
      .diagnostic-row {
        border-left: 3px solid #2563eb;
        background: #f7fafc;
        border-radius: 6px;
        padding: 9px 10px;
      }
      .diagnostic-row.warning { border-left-color: #d97706; background: #fff8ed; }
      .diagnostic-row.error { border-left-color: #dc2626; background: #fef2f2; }
      .diagnostic-code {
        color: #1f2937;
        font-size: 12px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .diagnostic-target {
        color: #6b7280;
        font: 11px/1.45 "SF Mono", monospace;
        margin-top: 3px;
        overflow-wrap: anywhere;
      }
      .diagnostic-message {
        color: #374151;
        font-size: 12px;
        line-height: 1.4;
        margin-top: 5px;
      }
      @media (max-width: 960px) {
        .main {
          grid-template-columns: 1fr;
          height: auto;
        }
        .sidebar,
        .inspector {
          border: 0;
          border-bottom: 1px solid #d9e0e6;
          max-height: none;
        }
        .viewer { min-height: 620px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Data Structure Profile Lineage</h1>
      <span class="subtitle">compiled lineage · validation diagnostics · measurement dry-run</span>
    </header>

    <div class="main">
      <aside class="sidebar">
        <h2>Profiles</h2>
        <div id="example-list"></div>
      </aside>

      <main class="viewer">
        <div class="stats" id="stats"></div>

        <div class="tabs">
          <div class="tab active" data-tab="svg">SVG</div>
          <div class="tab" data-tab="mermaid">Mermaid</div>
          <div class="tab" data-tab="d3">D3 Data</div>
        </div>

        <div class="tab-content">
          <div class="tab-pane active" id="tab-svg">
            <div id="svg-container"></div>
          </div>
          <div class="tab-pane" id="tab-mermaid">
            <pre><button class="copy-btn" data-target="mermaid-code">Copy</button><code id="mermaid-code"></code></pre>
          </div>
          <div class="tab-pane" id="tab-d3">
            <pre><button class="copy-btn" data-target="d3-code">Copy</button><code id="d3-code"></code></pre>
          </div>
        </div>
      </main>

      <aside class="inspector">
        <h2>Measurement</h2>
        <div class="measurement" id="measurement"></div>
        <h2>Diagnostics</h2>
        <div class="diagnostic-list" id="diagnostic-list"></div>
      </aside>
    </div>

    <script type="module" src="/src/data-structure-profile-preview.ts"></script>
  </body>
</html>
