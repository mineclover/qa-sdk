services:
  minio:
    image: minio/minio:latest
    env_file: .env.docker
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # Web Console
    environment:
      MINIO_DEFAULT_BUCKETS: qa-sdk-infra-state
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    env_file: .env.docker
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb local/qa-sdk-infra-state --ignore-existing;
      mc version enable local/qa-sdk-infra-state;
      echo '=== MinIO 초기화 완료 ===';
      echo '  S3: s3://qa-sdk-infra-state';
      echo '  Console: http://localhost:9001';
      "

  # Zitadel API + Login V2 SPA → Nginx 프록시(8085)로 통합
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    env_file: .env.docker
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALPORT: 8085
      # Docker 내부에서도 접근 가능하도록 도메인을 서비스명으로 설정하되
      # 외부에서는 nginx가 Host: localhost:8085로 프록시
      ZITADEL_EXTERNALDOMAIN: localhost
      # Login SPA가 Host: localhost로 접근할 수 있도록 추가 호스트 허용
      ZITADEL_SYSTEMDEFAULTS_DOMAINSADDITIONALHOSTS: "zitadel"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      # Machine User + PAT 자동 생성
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: qa-service
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: QA Service Account
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2027-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_TYPE: 1
    # 내부 포트만 (외부 노출은 nginx가 담당)
    expose:
      - "8080"
    depends_on:
      zitadel-db:
        condition: service_healthy
    # distroless 이미지 — curl/wget 없음. healthcheck 비활성화 + depends_on condition 제거
    healthcheck:
      disable: true

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:latest
    environment:
      # nginx 경유로 접근 — Host: localhost:8085가 유지됨
      ZITADEL_API_URL: http://zitadel-nginx:80
      NEXT_PUBLIC_API_URL: http://localhost:8085
      # Login SPA → Zitadel API 인증
      # 방법 1: PAT (Zitadel 기동 후 발급하여 여기에 설정)
      ZITADEL_SERVICE_USER_TOKEN: "${ZITADEL_LOGIN_TOKEN}"
    expose:
      - "3000"
    depends_on:
      - zitadel

  zitadel-nginx:
    image: nginx:alpine
    ports:
      - "8085:80"
    volumes:
      - ./nginx-zitadel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - zitadel
      - zitadel-login

  zitadel-db:
    image: postgres:16-alpine
    env_file: .env.docker
    environment:
      POSTGRES_DB: zitadel
    ports:
      - "5433:5432"
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minio-data:
  zitadel-db-data:
  zitadel-pat:
