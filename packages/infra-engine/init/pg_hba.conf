# qa-sdk-db pg_hba.conf — docker-compose 영속화용 커스텀 인증 정책
#
# 마운트 경로: /etc/postgresql/pg_hba.conf  (read-only)
# 적용 방법:   postgres -c hba_file=/etc/postgresql/pg_hba.conf
#
# 설계 근거
# - 표준 postgres docker image 의 default pg_hba.conf 는 'host replication ... 127.0.0.1/32'
#   만 허용 → docker bridge 네트워크의 qa-sdk-db-replica 가 streaming replication 으로
#   primary 에 붙지 못함.
# - PGDATA 볼륨이 보존되더라도(initdb skip) 본 파일이 마운트되어 있으면
#   replicator 인증이 항상 살아있다. → "docker compose down -v" 후에도 영속.
# - 추가 서브넷(개발자 호스트 LAN 등) 은 본 파일에 한 줄 추가해 PR 한다. 런타임 ALTER 금지.
#
# METHOD 선택
# - md5: scram-sha-256 으로 저장된 패스워드도 검증 가능 (postgres 호환 fallback).
#   기존 PGDATA 에 md5-encoded 패스워드가 남아있을 수 있어 md5 가 가장 안전.
# - scram-sha-256 으로 강화하려면 .env 패스워드 회전 + ALTER ROLE 후 본 파일을 일괄 변경.
#
# 컬럼: TYPE  DATABASE        USER            ADDRESS                 METHOD

# ── local socket: postgres superuser 만 trust (init 스크립트가 사용) ──
local   all             postgres                                trust
local   all             all                                     md5

# ── loopback ──
host    all             all             127.0.0.1/32            md5
host    all             all             ::1/128                 md5
host    replication     all             127.0.0.1/32            md5
host    replication     all             ::1/128                 md5

# ── 일반 application 접속 (auth_app/ingest_app/sim_app/qa_admin 등) ──
# docker bridge 기본 풀 + 사용자가 흔히 쓰는 사설 대역 전부 허용.
host    all             all             10.0.0.0/8              md5
host    all             all             172.16.0.0/12           md5
host    all             all             192.168.0.0/16          md5

# ── streaming replication: replicator 전용 ──
host    replication     replicator      10.0.0.0/8              md5
host    replication     replicator      172.16.0.0/12           md5
host    replication     replicator      192.168.0.0/16          md5
