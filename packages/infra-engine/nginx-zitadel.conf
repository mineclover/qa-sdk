upstream zitadel_api {
    server zitadel:8080;
}
upstream zitadel_login {
    server zitadel-login:3000;
}

server {
    listen 80;
    server_name localhost;

    location /ui/v2/login {
        proxy_pass http://zitadel_login;
        proxy_set_header Host localhost:8085;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:8085;
        proxy_set_header X-Forwarded-Port 8085;
    }

    location /_next/ {
        proxy_pass http://zitadel_login;
        proxy_set_header Host localhost:8085;
    }

    location / {
        proxy_pass http://zitadel_api;
        proxy_set_header Host localhost:8085;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host localhost:8085;
        proxy_set_header X-Forwarded-Port 8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
