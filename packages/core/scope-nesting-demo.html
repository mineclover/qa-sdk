<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Scope Nesting — Unified Timeline</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e4e4e7; }
    .header { padding: 20px 32px; border-bottom: 1px solid #27272a; display: flex; align-items: baseline; gap: 16px; }
    .header h1 { font-size: 18px; font-weight: 600; color: #fafafa; }
    .header .subtitle { font-size: 12px; color: #71717a; }
    .main { padding: 24px 32px; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .legend-group { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #71717a; }
    .legend-swatch { width: 14px; height: 10px; border-radius: 2px; }
    .legend-line { width: 20px; height: 0; border-top: 2px; }
    .tooltip { position: absolute; background: #18181b; border: 1px solid #3f3f46; border-radius: 6px; padding: 10px 14px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 10; max-width: 320px; }
    .tooltip h4 { color: #fafafa; font-size: 13px; margin-bottom: 6px; }
    .tooltip .row { display: flex; justify-content: space-between; gap: 16px; padding: 2px 0; }
    .tooltip .label { color: #71717a; }
    .tooltip .value { color: #e4e4e7; font-family: 'SF Mono', monospace; font-size: 11px; }
    .summary { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .summary-card { background: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 12px 18px; flex: 1; min-width: 140px; }
    .summary-card .label { font-size: 10px; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; }
    .summary-card .value { font-size: 20px; font-weight: 600; margin-top: 4px; }
    .valid { color: #4ade80; }
    .warn { color: #fbbf24; }
    svg text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Canonical Review — Scope Nesting Timeline</h1>
    <span class="subtitle">context-action 5계층 시뮬레이션 통합 뷰</span>
  </div>
  <div class="main">
    <div class="legend" id="legend"></div>
    <div id="timeline"></div>
    <div class="summary" id="summary"></div>
  </div>
  <div class="tooltip" id="tip"></div>

<script>
// ── 데이터 ──

const SCOPES = [
  { id: "qa-bridge", depth: 0, provides: ["logging-session"], consumes: [],
    business: "createQaBridge({ NoopTransport })", facets: ["소비"] },
  { id: "feature-context", depth: 1, provides: ["playbook-state", "persist-adapter"], consumes: ["logging-session"],
    business: "CanonicalReviewState { draft, issues, result, status }", facets: ["정의", "저장"],
    readyAfter: { "playbook-state": "persist_load_complete" } },
  { id: "handlers", depth: 2, provides: ["submission-handlers"], consumes: ["playbook-state", "logging-session"],
    business: "assessCanonicalReviewDraft(draft) → { issues, result }", facets: ["소비", "관리", "생산"] },
  { id: "view", depth: 3, provides: [], consumes: ["playbook-state", "submission-handlers"],
    business: "CanonicalReviewView → DOM render", facets: ["소비"] },
];

const PIPES = [
  { id: "persist-loader", scope: "feature-context", steps: [
    { facet: "저장", event: "persist_load_complete", label: "persist load" },
  ]},
  { id: "validate-input", scope: "handlers", steps: [
    { facet: "소비", event: "review_input", label: "draft 읽기" },
    { facet: "관리", event: null, label: "validation" },
  ]},
  { id: "compute-result", scope: "handlers", steps: [
    { facet: "소비", event: null, label: "결과 읽기" },
    { facet: "생산", event: "review_score", label: "score 계산" },
  ]},
  { id: "log-event", scope: "handlers", steps: [
    { facet: "소비", event: "review_logged", label: "logging (tap)" },
    { facet: "소비", event: null, label: "pass-through" },
  ]},
];

const CONTRACTS = [
  { id: "logging-session", type: "logging", from: "qa-bridge", to: ["feature-context", "handlers"] },
  { id: "playbook-state", type: "state", from: "feature-context", to: ["handlers", "view"],
    readyAfter: "persist_load_complete" },
  { id: "persist-adapter", type: "persist", from: "feature-context", to: [] },
  { id: "submission-handlers", type: "adapter", from: "handlers", to: ["view"] },
];

const DELEGATION = {
  pipe: "compute-result", contract: "playbook-state",
  completionEvent: "review_complete", tolerateStale: true,
};

const L0L3 = {
  l0: "fail-open",
  l1: { valid: true, issues: 1, paths: 4 },
  l15: { valid: true, snapshots: 4 },
  l2: { from: "editing", next: "submitting" },
  l3: { status: "complete", steps: 7, happy: true },
  timing: { valid: true, gaps: 0 },
};

// ── 색상 ──

const TYPE_C = {
  state: "#3b82f6", logging: "#f59e0b", persist: "#10b981", adapter: "#a855f7", custom: "#6b7280",
};
const FACET_C = {
  "생산": "#4ade80", "소비": "#60a5fa", "관리": "#fbbf24", "정의": "#c084fc", "저장": "#6ee7b7",
};
const SCOPE_C = ["#22d3ee", "#818cf8", "#f472b6", "#fb923c"];

// ── 타임라인 구축 ──

// 모든 step을 flatten
const allSteps = [];
let stepIdx = 0;
PIPES.forEach(pipe => {
  pipe.steps.forEach(s => {
    allSteps.push({ ...s, pipe: pipe.id, scope: pipe.scope, idx: stepIdx++ });
  });
});
const totalSteps = allSteps.length;

// readyAfter step 인덱스
const readyStepMap = {};
CONTRACTS.forEach(c => {
  if (c.readyAfter) {
    const step = allSteps.find(s => s.event === c.readyAfter);
    readyStepMap[c.id] = step ? step.idx : -1;
  }
});

// scope 활성 구간 (depth 순서 = 마운트 순서, 마운트 후 끝까지 활성)
const scopeRanges = SCOPES.map((s, i) => ({
  ...s, start: 0, end: totalSteps,
  mountAt: i, // depth = 마운트 순서
}));

// ── 렌더링 ──

const W = 900, ROW_H = 32, PAD = { top: 60, bottom: 40, left: 170, right: 40 };
const ROWS = [];

// 행 구성: scope 마운트 → contract readiness → pipe steps → delegation gap
// 1. Scope 마운트 구간
SCOPES.forEach(s => ROWS.push({ type: "scope", id: s.id, label: `scope: ${s.id}`, data: s }));
// 2. Contract readiness
CONTRACTS.filter(c => c.readyAfter).forEach(c => ROWS.push({ type: "readiness", id: c.id, label: `contract: ${c.id}`, data: c }));
// 3. Pipe steps
PIPES.forEach(p => ROWS.push({ type: "pipe", id: p.id, label: `pipe: ${p.id}`, data: p }));
// 4. Delegation gap (있으면)
ROWS.push({ type: "delegation", id: "delegation", label: "delegation gap", data: DELEGATION });

const H = PAD.top + ROWS.length * ROW_H + PAD.bottom;

const svg = d3.select("#timeline").append("svg").attr("width", W).attr("height", H);
const tip = d3.select("#tip");

// 스케일
const x = d3.scaleLinear().domain([0, totalSteps]).range([PAD.left, W - PAD.right]);
const y = (i) => PAD.top + i * ROW_H;

// 배경 그리드
for (let i = 0; i <= totalSteps; i++) {
  svg.append("line")
    .attr("x1", x(i)).attr("y1", PAD.top - 10)
    .attr("x2", x(i)).attr("y2", H - PAD.bottom)
    .attr("stroke", "#1f1f23").attr("stroke-width", 1);
}

// step 헤더
for (let i = 0; i < totalSteps; i++) {
  svg.append("text")
    .attr("x", x(i) + (x(1) - x(0)) / 2).attr("y", PAD.top - 16)
    .attr("text-anchor", "middle").attr("fill", "#52525b").attr("font-size", 9)
    .text(`s${i}`);
}

// 행 라벨
ROWS.forEach((row, i) => {
  const color = row.type === "scope" ? SCOPE_C[row.data.depth] :
    row.type === "readiness" ? TYPE_C[row.data.type] :
    row.type === "pipe" ? "#a1a1aa" : "#f472b6";
  svg.append("text")
    .attr("x", PAD.left - 8).attr("y", y(i) + ROW_H / 2 + 4)
    .attr("text-anchor", "end").attr("fill", color).attr("font-size", 11)
    .attr("font-family", "'SF Mono', monospace")
    .text(row.label);
});

// ── 행별 렌더링 ──

ROWS.forEach((row, ri) => {
  const ry = y(ri);

  if (row.type === "scope") {
    // scope 마운트 구간 — depth부터 끝까지 활성
    const s = row.data;
    svg.append("rect")
      .attr("x", x(0)).attr("y", ry + 4)
      .attr("width", x(totalSteps) - x(0)).attr("height", ROW_H - 8)
      .attr("rx", 4).attr("fill", SCOPE_C[s.depth]).attr("opacity", 0.12);

    // provides 마커
    s.provides.forEach((cId, ci) => {
      const cx = x(0) + 8 + ci * 6;
      svg.append("circle")
        .attr("cx", cx).attr("cy", ry + ROW_H / 2)
        .attr("r", 3).attr("fill", TYPE_C[CONTRACTS.find(c => c.id === cId)?.type || "custom"]);
    });

    // 패싯 마커 (우측)
    s.facets.forEach((f, fi) => {
      svg.append("circle")
        .attr("cx", x(totalSteps) - 8 - fi * 14).attr("cy", ry + ROW_H / 2)
        .attr("r", 4).attr("fill", FACET_C[f]).attr("opacity", 0.7);
      svg.append("text")
        .attr("x", x(totalSteps) - 8 - fi * 14).attr("y", ry + ROW_H / 2 + 3)
        .attr("text-anchor", "middle").attr("fill", "#18181b").attr("font-size", 7).attr("font-weight", 700)
        .text(f[0]);
    });
  }

  if (row.type === "readiness") {
    const c = row.data;
    const readyAt = readyStepMap[c.id];
    if (readyAt >= 0) {
      // pending 구간 (빨간)
      svg.append("rect")
        .attr("x", x(0)).attr("y", ry + 8)
        .attr("width", x(readyAt) - x(0)).attr("height", ROW_H - 16)
        .attr("rx", 3).attr("fill", "#ef4444").attr("opacity", 0.25);
      svg.append("text")
        .attr("x", x(readyAt / 2)).attr("y", ry + ROW_H / 2 + 3)
        .attr("text-anchor", "middle").attr("fill", "#ef4444").attr("font-size", 9).text("pending");

      // ready 구간 (초록)
      svg.append("rect")
        .attr("x", x(readyAt)).attr("y", ry + 8)
        .attr("width", x(totalSteps) - x(readyAt)).attr("height", ROW_H - 16)
        .attr("rx", 3).attr("fill", "#4ade80").attr("opacity", 0.15);

      // ready 마커
      svg.append("line")
        .attr("x1", x(readyAt)).attr("y1", ry + 4)
        .attr("x2", x(readyAt)).attr("y2", ry + ROW_H - 4)
        .attr("stroke", "#4ade80").attr("stroke-width", 2);
    } else {
      // 즉시 ready
      svg.append("rect")
        .attr("x", x(0)).attr("y", ry + 8)
        .attr("width", x(totalSteps) - x(0)).attr("height", ROW_H - 16)
        .attr("rx", 3).attr("fill", "#4ade80").attr("opacity", 0.1);
    }
  }

  if (row.type === "pipe") {
    const pipe = row.data;
    const pipeSteps = allSteps.filter(s => s.pipe === pipe.id);
    pipeSteps.forEach(s => {
      const sw = x(1) - x(0) - 2;
      const color = FACET_C[s.facet] || "#71717a";

      const rect = svg.append("rect")
        .attr("x", x(s.idx) + 1).attr("y", ry + 4)
        .attr("width", sw).attr("height", ROW_H - 8)
        .attr("rx", 4).attr("fill", color).attr("opacity", 0.3)
        .attr("cursor", "pointer");

      svg.append("text")
        .attr("x", x(s.idx) + sw / 2 + 1).attr("y", ry + ROW_H / 2 + 3)
        .attr("text-anchor", "middle").attr("fill", color).attr("font-size", 9)
        .attr("pointer-events", "none")
        .text(s.label);

      // 이벤트 마커
      if (s.event) {
        svg.append("circle")
          .attr("cx", x(s.idx + 1) - 4).attr("cy", ry + 6)
          .attr("r", 3).attr("fill", "#fafafa").attr("opacity", 0.6);
      }

      // 툴팁
      rect.on("mouseover", (evt) => {
        tip.style("opacity", 1)
          .style("left", evt.pageX + 12 + "px")
          .style("top", evt.pageY - 10 + "px")
          .html(`<h4>${s.pipe} — step ${s.idx}</h4>
            <div class="row"><span class="label">패싯</span><span class="value">${s.facet}</span></div>
            <div class="row"><span class="label">scope</span><span class="value">${pipe.scope}</span></div>
            ${s.event ? `<div class="row"><span class="label">이벤트</span><span class="value">${s.event}</span></div>` : ""}
            ${s.label ? `<div class="row"><span class="label">동작</span><span class="value">${s.label}</span></div>` : ""}`);
      }).on("mouseout", () => tip.style("opacity", 0));
    });
  }

  if (row.type === "delegation") {
    // delegation gap 시각화 (현 시나리오에서는 gap=0이므로 정상 표시)
    const d = row.data;
    const delegatorSteps = allSteps.filter(s => s.pipe === d.pipe);
    const startStep = delegatorSteps[0]?.idx ?? 0;
    const completionStep = allSteps.find(s => s.event === d.completionEvent)?.idx;

    if (completionStep !== undefined) {
      // 위임 구간
      svg.append("rect")
        .attr("x", x(startStep)).attr("y", ry + 8)
        .attr("width", x(completionStep + 1) - x(startStep)).attr("height", ROW_H - 16)
        .attr("rx", 3).attr("fill", "#f472b6").attr("opacity", 0.15);

      svg.append("text")
        .attr("x", x((startStep + completionStep + 1) / 2)).attr("y", ry + ROW_H / 2 + 3)
        .attr("text-anchor", "middle").attr("fill", "#f472b6").attr("font-size", 9)
        .text(`${d.contract} 위임 (${d.tolerateStale ? "stale 허용" : "stale 금지"})`);

      // 완료 마커
      svg.append("line")
        .attr("x1", x(completionStep + 1)).attr("y1", ry + 4)
        .attr("x2", x(completionStep + 1)).attr("y2", ry + ROW_H - 4)
        .attr("stroke", "#4ade80").attr("stroke-width", 2);
    }
  }
});

// ── L0→L3 연결선 (우측 마진) ──

const layers = [
  { label: "L0", y: y(0) + ROW_H / 2, color: "#4ade80" },
  { label: "L1", y: y(1) + ROW_H / 2, color: "#60a5fa" },
  { label: "L1.5", y: y(SCOPES.length) + ROW_H / 2, color: "#fbbf24" },
  { label: "L2", y: y(SCOPES.length + 1) + ROW_H / 2, color: "#c084fc" },
  { label: "L3", y: y(ROWS.length - 1) + ROW_H / 2, color: "#f472b6" },
];

const lx = W - 28;
layers.forEach(l => {
  svg.append("text")
    .attr("x", lx).attr("y", l.y + 4)
    .attr("text-anchor", "middle").attr("fill", l.color).attr("font-size", 9).attr("font-weight", 600)
    .text(l.label);
});

// ── 범례 ──

const legend = d3.select("#legend");
[["state", TYPE_C.state], ["logging", TYPE_C.logging], ["persist", TYPE_C.persist], ["adapter", TYPE_C.adapter]].forEach(([t, c]) => {
  const g = legend.append("div").attr("class", "legend-group");
  g.append("div").attr("class", "legend-swatch").style("background", c);
  g.append("span").text(t);
});
legend.append("div").style("width", "1px").style("height", "12px").style("background", "#27272a");
Object.entries(FACET_C).forEach(([f, c]) => {
  const g = legend.append("div").attr("class", "legend-group");
  g.append("div").attr("class", "legend-swatch").style("background", c).style("border-radius", "50%");
  g.append("span").text(f);
});
legend.append("div").style("width", "1px").style("height", "12px").style("background", "#27272a");
[["pending", "#ef4444"], ["ready", "#4ade80"], ["delegation", "#f472b6"]].forEach(([t, c]) => {
  const g = legend.append("div").attr("class", "legend-group");
  g.append("div").attr("class", "legend-swatch").style("background", c).style("opacity", "0.3");
  g.append("span").text(t);
});

// ── 요약 카드 ──

const summary = d3.select("#summary");
[
  { label: "L1 구조", value: `${L0L3.l1.paths} paths`, cls: "valid" },
  { label: "L1.5 마운트", value: `${L0L3.l15.snapshots} snapshots`, cls: "valid" },
  { label: "L2 전이", value: `${L0L3.l2.from}→${L0L3.l2.next}`, cls: "valid" },
  { label: "L3 시뮬", value: `${L0L3.l3.steps} steps`, cls: "valid" },
  { label: "Timing", value: `${L0L3.timing.gaps} gaps`, cls: L0L3.timing.gaps > 0 ? "warn" : "valid" },
  { label: "Happy Path", value: L0L3.l3.happy ? "match" : "diverged", cls: L0L3.l3.happy ? "valid" : "warn" },
].forEach(c => {
  const card = summary.append("div").attr("class", "summary-card");
  card.append("div").attr("class", "label").text(c.label);
  card.append("div").attr("class", `value ${c.cls}`).text(c.value);
});
</script>
</body>
</html>
