<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Scope Nesting — Unified Timeline</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e4e4e7; }
    .header { padding: 20px 32px; border-bottom: 1px solid #27272a; display: flex; align-items: baseline; gap: 16px; }
    .header h1 { font-size: 18px; font-weight: 600; color: #fafafa; }
    .header .sub { font-size: 12px; color: #71717a; }
    .main { padding: 24px 32px; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .legend-group { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #71717a; }
    .legend-swatch { width: 14px; height: 10px; border-radius: 2px; }
    .tooltip { position: absolute; background: #18181b; border: 1px solid #3f3f46; border-radius: 6px; padding: 10px 14px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 10; max-width: 340px; }
    .tooltip h4 { color: #fafafa; margin-bottom: 6px; }
    .tooltip .r { display: flex; justify-content: space-between; gap: 16px; padding: 2px 0; }
    .tooltip .l { color: #71717a; }
    .tooltip .v { color: #e4e4e7; font-family: 'SF Mono', monospace; font-size: 11px; }
    .cards { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 12px 16px; flex: 1; min-width: 120px; }
    .card .cl { font-size: 10px; color: #71717a; text-transform: uppercase; letter-spacing: 0.04em; }
    .card .cv { font-size: 18px; font-weight: 600; margin-top: 4px; }
    .ok { color: #4ade80; } .ng { color: #fbbf24; }
    svg text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .sep { width: 1px; height: 12px; background: #27272a; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Canonical Review — Scope Nesting Timeline</h1>
    <span class="sub">contract descent · mount flow · pipe simulation · delegation gap</span>
  </div>
  <div class="main">
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
    <div class="cards" id="cards"></div>
  </div>
  <div class="tooltip" id="tip"></div>

<script>
/* ================================================================
   데이터 — Canonical Review 비즈니스 로직
   ================================================================ */

const FACET = {
  produce:  { label: "생산", color: "#4ade80" },
  consume:  { label: "소비", color: "#60a5fa" },
  manage:   { label: "관리", color: "#fbbf24" },
  define:   { label: "정의", color: "#c084fc" },
  store:    { label: "저장", color: "#6ee7b7" },
};

const CONTRACT_TYPE = {
  state:   { color: "#3b82f6" },
  logging: { color: "#f59e0b" },
  persist: { color: "#10b981" },
  adapter: { color: "#a855f7" },
};

const SCOPE_COLOR = ["#22d3ee", "#818cf8", "#f472b6", "#fb923c"];

const SCOPES = [
  { id: "qa-bridge", provides: ["logging-session"], consumes: [],
    facets: ["consume"], biz: "createQaBridge({ NoopTransport })" },
  { id: "feature-context", provides: ["playbook-state", "persist-adapter"], consumes: ["logging-session"],
    facets: ["define", "store"], biz: "CanonicalReviewState { draft, issues, result, status }",
    readyAfter: { "playbook-state": "persist_load_complete" } },
  { id: "handlers", provides: ["submission-handlers"], consumes: ["playbook-state", "logging-session"],
    facets: ["consume", "manage", "produce"], biz: "assessCanonicalReviewDraft(draft)" },
  { id: "view", provides: [], consumes: ["playbook-state", "submission-handlers"],
    facets: ["consume"], biz: "CanonicalReviewView → DOM" },
];

const CONTRACTS = [
  { id: "logging-session", type: "logging", from: "qa-bridge", to: ["feature-context", "handlers"], readyAfter: null },
  { id: "playbook-state", type: "state", from: "feature-context", to: ["handlers", "view"], readyAfter: "persist_load_complete" },
  { id: "persist-adapter", type: "persist", from: "feature-context", to: [], readyAfter: null },
  { id: "submission-handlers", type: "adapter", from: "handlers", to: ["view"], readyAfter: null },
];

const PIPES = [
  { id: "persist-loader", scope: "feature-context", steps: [
    { facet: "store", event: "persist_load_complete", label: "persist load" },
  ]},
  { id: "validate-input", scope: "handlers", steps: [
    { facet: "consume", event: "review_input", label: "draft 읽기" },
    { facet: "manage", event: null, label: "validation" },
  ]},
  { id: "compute-result", scope: "handlers", steps: [
    { facet: "consume", event: null, label: "결과 읽기" },
    { facet: "produce", event: "review_score", label: "score 계산" },
  ]},
  { id: "log-event", scope: "handlers", steps: [
    { facet: "consume", event: "review_logged", label: "logging (tap)" },
    { facet: "consume", event: null, label: "pass-through" },
  ]},
];

const DELEGATION = { pipe: "compute-result", contract: "playbook-state",
  completionEvent: "review_complete", tolerateStale: true };

const RESULTS = { l1: { valid: true, paths: 4 }, l15: { valid: true, snapshots: 4 },
  l2: { from: "editing", next: "submitting" }, l3: { steps: 7, happy: true },
  timing: { valid: true, gaps: 0 } };

/* ================================================================
   타임라인 구축
   ================================================================ */

// step flatten
const steps = [];
let si = 0;
PIPES.forEach(p => p.steps.forEach(s => steps.push({ ...s, pipe: p.id, scope: p.scope, idx: si++ })));
const N = steps.length;

// readyAfter → step index
const readyAt = {};
CONTRACTS.forEach(c => {
  if (!c.readyAfter) return;
  const s = steps.find(s => s.event === c.readyAfter);
  readyAt[c.id] = s ? s.idx : -1;
});

// 행 목록 조립
const rows = [];
SCOPES.forEach((s, i) => rows.push({ type: "scope", id: s.id, label: s.id, data: s, depth: i }));
CONTRACTS.filter(c => c.readyAfter).forEach(c => rows.push({ type: "ready", id: c.id, label: c.id, data: c }));
PIPES.forEach(p => rows.push({ type: "pipe", id: p.id, label: p.id, data: p }));
rows.push({ type: "deleg", id: "deleg", label: "delegation", data: DELEGATION });

/* ================================================================
   렌더 함수 — 행 타입별 반복 패턴
   ================================================================ */

const W = 960, RH = 36, PAD = { t: 56, b: 30, l: 180, r: 50 };
const H = PAD.t + rows.length * RH + PAD.b;
const svg = d3.select("#chart").append("svg").attr("width", W).attr("height", H);
const tip = d3.select("#tip");
const xS = d3.scaleLinear().domain([0, N]).range([PAD.l, W - PAD.r]);
const yR = i => PAD.t + i * RH;
const sw = xS(1) - xS(0); // step 폭

// 그리드
for (let i = 0; i <= N; i++)
  svg.append("line").attr("x1", xS(i)).attr("y1", PAD.t - 8).attr("x2", xS(i)).attr("y2", H - PAD.b)
    .attr("stroke", "#1f1f23");

// step 헤더
steps.forEach((s, i) => {
  svg.append("text").attr("x", xS(i) + sw / 2).attr("y", PAD.t - 14)
    .attr("text-anchor", "middle").attr("fill", "#3f3f46").attr("font-size", 9)
    .text(`step ${i}`);
});

// 행 라벨 + 구분선
const typeColor = { scope: i => SCOPE_COLOR[i], ready: d => CONTRACT_TYPE[d.type]?.color || "#6b7280",
  pipe: () => "#a1a1aa", deleg: () => "#f472b6" };

rows.forEach((r, i) => {
  const c = r.type === "scope" ? typeColor.scope(r.depth) : typeColor[r.type](r.data);
  svg.append("text").attr("x", PAD.l - 10).attr("y", yR(i) + RH / 2 + 4)
    .attr("text-anchor", "end").attr("fill", c).attr("font-size", 11)
    .attr("font-family", "'SF Mono', monospace").text(r.label);
  // 행 배경 (짝수)
  if (i % 2 === 0)
    svg.append("rect").attr("x", xS(0)).attr("y", yR(i)).attr("width", xS(N) - xS(0)).attr("height", RH)
      .attr("fill", "#ffffff").attr("opacity", 0.015);
});

/* ── 행 타입별 렌더 ── */

function renderScope(r, ri) {
  const s = r.data, ry = yR(ri);
  // 활성 바
  svg.append("rect").attr("x", xS(0)).attr("y", ry + 5).attr("width", xS(N) - xS(0)).attr("height", RH - 10)
    .attr("rx", 4).attr("fill", SCOPE_COLOR[r.depth]).attr("opacity", 0.1);
  // provides 뱃지
  s.provides.forEach((cId, ci) => {
    const ct = CONTRACTS.find(c => c.id === cId);
    const clr = CONTRACT_TYPE[ct?.type]?.color || "#6b7280";
    const bx = xS(0) + 6 + ci * (sw * 0.7 + 4);
    svg.append("rect").attr("x", bx).attr("y", ry + 8).attr("width", sw * 0.7).attr("height", 14)
      .attr("rx", 3).attr("fill", clr).attr("opacity", 0.2);
    svg.append("text").attr("x", bx + sw * 0.35).attr("y", ry + 18)
      .attr("text-anchor", "middle").attr("fill", clr).attr("font-size", 8).text(cId);
  });
  // facets (우측, 풀네임)
  s.facets.forEach((fk, fi) => {
    const f = FACET[fk];
    const tx = xS(N) - 8 - fi * 42;
    svg.append("text").attr("x", tx).attr("y", ry + RH / 2 + 3)
      .attr("text-anchor", "end").attr("fill", f.color).attr("font-size", 9).attr("opacity", 0.8)
      .text(f.label);
  });
}

function renderReady(r, ri) {
  const c = r.data, ry = yR(ri);
  const ra = readyAt[c.id];
  const clr = CONTRACT_TYPE[c.type]?.color || "#6b7280";
  if (ra >= 0) {
    // pending
    svg.append("rect").attr("x", xS(0)).attr("y", ry + 9).attr("width", xS(ra) - xS(0)).attr("height", RH - 18)
      .attr("rx", 3).attr("fill", "#ef4444").attr("opacity", 0.2);
    svg.append("text").attr("x", (xS(0) + xS(ra)) / 2).attr("y", ry + RH / 2 + 3)
      .attr("text-anchor", "middle").attr("fill", "#ef4444").attr("font-size", 9).text("pending");
    // ready
    svg.append("rect").attr("x", xS(ra)).attr("y", ry + 9).attr("width", xS(N) - xS(ra)).attr("height", RH - 18)
      .attr("rx", 3).attr("fill", clr).attr("opacity", 0.12);
    svg.append("text").attr("x", (xS(ra) + xS(N)) / 2).attr("y", ry + RH / 2 + 3)
      .attr("text-anchor", "middle").attr("fill", clr).attr("font-size", 9).text("ready");
    // 수직 마커
    svg.append("line").attr("x1", xS(ra)).attr("y1", ry + 5).attr("x2", xS(ra)).attr("y2", ry + RH - 5)
      .attr("stroke", "#4ade80").attr("stroke-width", 2);
  } else {
    svg.append("rect").attr("x", xS(0)).attr("y", ry + 9).attr("width", xS(N) - xS(0)).attr("height", RH - 18)
      .attr("rx", 3).attr("fill", clr).attr("opacity", 0.08);
  }
}

function renderPipe(r, ri) {
  const pipe = r.data, ry = yR(ri);
  const ps = steps.filter(s => s.pipe === pipe.id);
  ps.forEach(s => {
    const f = FACET[s.facet] || { label: s.facet, color: "#71717a" };
    const bx = xS(s.idx) + 1, bw = sw - 2;
    // 블록
    svg.append("rect").attr("x", bx).attr("y", ry + 5).attr("width", bw).attr("height", RH - 10)
      .attr("rx", 4).attr("fill", f.color).attr("opacity", 0.25).attr("cursor", "pointer")
      .on("mouseover", evt => showTip(evt, s, pipe))
      .on("mouseout", () => tip.style("opacity", 0));
    // 패싯 이름 (풀네임)
    svg.append("text").attr("x", bx + bw / 2).attr("y", ry + RH / 2 - 2)
      .attr("text-anchor", "middle").attr("fill", f.color).attr("font-size", 9).attr("font-weight", 600)
      .attr("pointer-events", "none").text(f.label);
    // 동작 라벨
    svg.append("text").attr("x", bx + bw / 2).attr("y", ry + RH / 2 + 10)
      .attr("text-anchor", "middle").attr("fill", "#52525b").attr("font-size", 8)
      .attr("pointer-events", "none").text(s.label);
    // 이벤트 마커
    if (s.event)
      svg.append("circle").attr("cx", bx + bw - 5).attr("cy", ry + 9).attr("r", 3)
        .attr("fill", "#fafafa").attr("opacity", 0.5);
  });
}

function renderDeleg(r, ri) {
  const d = r.data, ry = yR(ri);
  const ds = steps.filter(s => s.pipe === d.pipe);
  const start = ds[0]?.idx ?? 0;
  const end = steps.find(s => s.event === d.completionEvent)?.idx;
  if (end == null) return;
  // 위임 구간
  svg.append("rect").attr("x", xS(start)).attr("y", ry + 9).attr("width", xS(end + 1) - xS(start)).attr("height", RH - 18)
    .attr("rx", 3).attr("fill", "#f472b6").attr("opacity", 0.15);
  const label = `${d.contract} 위임 (${d.tolerateStale ? "stale 허용" : "stale 금지"})`;
  svg.append("text").attr("x", (xS(start) + xS(end + 1)) / 2).attr("y", ry + RH / 2 + 3)
    .attr("text-anchor", "middle").attr("fill", "#f472b6").attr("font-size", 9).text(label);
  svg.append("line").attr("x1", xS(end + 1)).attr("y1", ry + 5).attr("x2", xS(end + 1)).attr("y2", ry + RH - 5)
    .attr("stroke", "#4ade80").attr("stroke-width", 2);
}

const RENDER = { scope: renderScope, ready: renderReady, pipe: renderPipe, deleg: renderDeleg };
rows.forEach((r, i) => RENDER[r.type](r, i));

/* ── L 라벨 (우측) ── */
const layers = [
  { label: "L0", y: yR(0), color: "#4ade80" },
  { label: "L1", y: yR(1), color: "#60a5fa" },
  { label: "L1.5", y: yR(SCOPES.length), color: "#fbbf24" },
  { label: "L3", y: yR(rows.length - 2), color: "#818cf8" },
];
layers.forEach(l => {
  svg.append("text").attr("x", W - PAD.r + 20).attr("y", l.y + RH / 2 + 4)
    .attr("text-anchor", "middle").attr("fill", l.color).attr("font-size", 9).attr("font-weight", 600)
    .text(l.label);
});

/* ── 툴팁 ── */
function showTip(evt, s, pipe) {
  const f = FACET[s.facet] || { label: s.facet };
  tip.style("opacity", 1).style("left", evt.pageX + 14 + "px").style("top", evt.pageY - 8 + "px")
    .html(`<h4>${s.pipe} — step ${s.idx}</h4>
      <div class="r"><span class="l">패싯</span><span class="v">${f.label}</span></div>
      <div class="r"><span class="l">scope</span><span class="v">${pipe.scope}</span></div>
      <div class="r"><span class="l">동작</span><span class="v">${s.label}</span></div>
      ${s.event ? `<div class="r"><span class="l">이벤트</span><span class="v">${s.event}</span></div>` : ""}`);
}

/* ── 범례 ── */
const leg = d3.select("#legend");
function addLeg(label, color, round) {
  const g = leg.append("div").attr("class", "legend-group");
  g.append("div").attr("class", "legend-swatch")
    .style("background", color).style("border-radius", round ? "50%" : "2px");
  g.append("span").text(label);
}
Object.entries(CONTRACT_TYPE).forEach(([t, v]) => addLeg(t, v.color));
leg.append("div").attr("class", "sep");
Object.values(FACET).forEach(f => addLeg(f.label, f.color, true));
leg.append("div").attr("class", "sep");
[["pending", "#ef4444"], ["ready", "#4ade80"], ["delegation", "#f472b6"]].forEach(([l, c]) => addLeg(l, c));

/* ── 요약 카드 ── */
const cards = d3.select("#cards");
[
  { l: "L1 구조", v: `${RESULTS.l1.paths} paths`, c: "ok" },
  { l: "L1.5 마운트", v: `${RESULTS.l15.snapshots} snapshots`, c: "ok" },
  { l: "L2 전이", v: `${RESULTS.l2.from} → ${RESULTS.l2.next}`, c: "ok" },
  { l: "L3 시뮬", v: `${RESULTS.l3.steps} steps`, c: "ok" },
  { l: "Timing", v: `${RESULTS.timing.gaps} gaps`, c: RESULTS.timing.gaps > 0 ? "ng" : "ok" },
  { l: "Happy Path", v: RESULTS.l3.happy ? "match" : "diverged", c: RESULTS.l3.happy ? "ok" : "ng" },
].forEach(d => {
  const c = cards.append("div").attr("class", "card");
  c.append("div").attr("class", "cl").text(d.l);
  c.append("div").attr("class", `cv ${d.c}`).text(d.v);
});
</script>
</body>
</html>
