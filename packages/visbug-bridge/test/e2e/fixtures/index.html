<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>visbug-bridge e2e</title>
  <script type="importmap">
  {
    "imports": {
      "visbug": "/vendor/projectvisbug/app/bundle.js"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <p data-test="target">hello</p>
  </main>
  <script type="module">
    import { mountVisBug } from '/packages/visbug-bridge/dist/index.js'
    window.__entries = []
    window.__ctrl = mountVisBug(document.body, {
      onEntry: (e) => window.__entries.push(e),
    })
  </script>
</body>
</html>
