services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  openmetadata-seed:
    image: alpine:3.20
    command: ["sh", "-c", "echo seed metadata in CI/CD pipeline"]
    volumes:
      - ../apps/api/src/modules/assignment/metadata:/metadata:ro

