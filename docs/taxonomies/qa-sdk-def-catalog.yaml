taxonomy: qa-sdk-def-catalog
version: 1
description: |
  qa-sdk definition-catalog의 문서 메타데이터 좌표 체계.
  vocabulary.ts의 DEF_* const에서 자동 추출.

  이건 "qa-sdk가 자기 문서를 어떻게 분류하는가"의 표현.
  서비스 토폴로지(qa-sdk-coordinate-system.yaml)와는 별개 — 같은 시스템의 두 차원.

  SSOT: packages/definition-catalog/src/vocabulary.ts

axes:
  def_scope:
    description: 문서 인지 관점 분류 (소프트웨어 정의 대분류)
    lifecycle: approved
    entries:
      - { id: ui,         address: 0, lifecycle: approved }
      - { id: feature,    address: 1, lifecycle: approved }
      - { id: flow,       address: 2, lifecycle: approved }
      - { id: state,      address: 3, lifecycle: approved }
      - { id: constraint, address: 4, lifecycle: approved }
      - { id: data,       address: 5, lifecycle: approved }
      - { id: interface,  address: 6, lifecycle: approved }
      - { id: meta,       address: 7, lifecycle: approved }
      - { id: decision,   address: 8, lifecycle: approved }
    capacity: 32
    version: 1

  def_depth:
    description: 정의 깊이 (overview → validation)
    lifecycle: approved
    entries:
      - { id: overview,        address: 0, lifecycle: approved }
      - { id: specification,   address: 1, lifecycle: approved }
      - { id: implementation,  address: 2, lifecycle: approved }
      - { id: validation,      address: 3, lifecycle: approved }
    capacity: 8
    version: 1

  def_level:
    description: contains 그래프 검증용 역할 레벨
    lifecycle: approved
    entries:
      - { id: group,   address: 0, lifecycle: approved }
      - { id: module,  address: 1, lifecycle: approved }
      - { id: leaf,    address: 2, lifecycle: approved }
    capacity: 8
    version: 1

  def_lifecycle:
    description: 문서 lifecycle 상태 (vocabulary 5 + taxonomy-engine schema 추가 tbd)
    lifecycle: approved
    entries:
      - { id: draft,      address: 0, lifecycle: approved }
      - { id: review,     address: 1, lifecycle: approved }
      - { id: approved,   address: 2, lifecycle: approved }
      - { id: deprecated, address: 3, lifecycle: approved }
      - { id: archived,   address: 4, lifecycle: approved }
      - { id: tbd,        address: 5, lifecycle: approved }
    capacity: 16
    version: 1

  link_type:
    description: 문서 간 링크 종류 (DKG 엣지와 별개 — def-catalog 자체 link)
    lifecycle: approved
    entries:
      - { id: depends_on,    address: 0, lifecycle: approved }
      - { id: implements,    address: 1, lifecycle: approved }
      - { id: refines,       address: 2, lifecycle: approved }
      - { id: constrains,    address: 3, lifecycle: approved }
      - { id: traces_to,     address: 4, lifecycle: approved }
      - { id: contains,      address: 5, lifecycle: approved }
      - { id: evolves_from,  address: 6, lifecycle: approved }
      - { id: supersedes,    address: 7, lifecycle: approved }
      - { id: refs,          address: 8, lifecycle: approved }
      - { id: verifies,      address: 9, lifecycle: approved }
    capacity: 32
    version: 1

  taxonomy_family:
    description: meta-taxonomy 분류 (DocLinker가 다루는 taxonomy의 종류)
    lifecycle: approved
    entries:
      - { id: topological,  address: 0, lifecycle: approved }
      - { id: functional,   address: 1, lifecycle: approved }
      - { id: bridge,       address: 2, lifecycle: approved }
    capacity: 8
    version: 1

constraints:
  - id: scope-9-entries
    kind: capacity
    rule:
      axis: def_scope
      prop: entries.length
      op: eq
      value: 9
    severity: error

  - id: level-3-entries
    kind: capacity
    rule:
      axis: def_level
      prop: entries.length
      op: eq
      value: 3
    severity: error

  - id: link-type-required
    kind: ref
    rule:
      axis: link_type
      mustExist: true
    severity: error
