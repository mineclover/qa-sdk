# Prometheus 스크레이프 설정
# 로컬 개발: docker compose -f monitoring/docker-compose.monitoring.yml up
# HA 배포: docker compose -f docker-compose.yml -f docker-compose.ha.yml up

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerting-rules.yml"

scrape_configs:
  # ── ingest-server ──
  - job_name: "ingest-server"
    metrics_path: "/v1/metrics"
    static_configs:
      - targets: ["host.docker.internal:3200"]
        labels:
          service: "ingest-server"
          env: "dev"

  # ── registry-service ──
  - job_name: "registry-service"
    metrics_path: "/health"
    static_configs:
      - targets: ["host.docker.internal:3300"]
        labels:
          service: "registry-service"
          env: "dev"

  # ── gate-service ──
  - job_name: "gate-service"
    metrics_path: "/health"
    static_configs:
      - targets: ["host.docker.internal:3400"]
        labels:
          service: "gate-service"
          env: "dev"

  # ── query-service ──
  - job_name: "query-service"
    metrics_path: "/health"
    static_configs:
      - targets: ["host.docker.internal:3500"]
        labels:
          service: "query-service"
          env: "dev"

  # ── decode-service ──
  - job_name: "decode-service"
    metrics_path: "/health"
    static_configs:
      - targets: ["host.docker.internal:3600"]
        labels:
          service: "decode-service"
          env: "dev"
